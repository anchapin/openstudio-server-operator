# Redis — stand-in for the helm chart's `redis` Deployment behind Service
# `queue` (develop branch). Image, password, args and Service name mirror the
# chart defaults:
#   redis.container.image = redis:7.4.10 (chart default is 6.0.9 — EOL since 2021)
#   redis.password        = openstudio-rotated (issue #150 — was the legacy literal
#                           'openstudio'; rotated because shipping a known
#                           hardcoded password in source defeats the kind-recipe
#                           cluster's auth boundary. Run
#                           scripts/rotate_redis_password.sh per-cluster to
#                           install a fresh random password before applying.)
#   redis_svc.name        = queue   (port 6379)
#   args                  = redis-server --appendonly yes --requirepass ... --maxclients 10000
# The operator's read-only Redis client (#12) targets `queue:6379` with this
# same password.
# APPENDIX (approximation vs production): chart uses a 100Gi PVC; here an
# emptyDir — queue state does not survive pod restarts. Fine for API
# validation.
# Digest pinning (issue #172): the kind recipe is the project's validation
# target (D13); image-boundary digests are pinned to close the supply-chain
# drift gap that #113/#124 closed for the operator / rclone / python images.
# Renew via `docker buildx imagetools inspect redis:7.4.10`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: openstudio-server
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.10@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - openstudio-rotated
            - --maxclients
            - "10000"
          volumeMounts:
            - mountPath: /data
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: redis
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: openstudio-server
spec:
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
