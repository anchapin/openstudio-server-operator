# Worker — mirrors the helm chart's `worker` Deployment, scaled-minimal
# (replicas: 1 — the chart's worker-hpa runs 2–20 in production).
# Same 3.11.0 image, QUEUES=requeued,simulations, COUNT=1, command
# /usr/local/bin/start-workers, and emptyDir scratch at /mnt/openstudio
# (per the chart: worker scratch is node-local emptyDir, NOT the nfs-pvc).
#
# The preStop lifecycle hook and terminationGracePeriodSeconds: 5200 from the
# chart are kept — the operator's surgical pod-eviction escalation (#9) and
# the worker recycler (#11) delete worker pods, so the shutdown path matters.
#
# Autoscaling (issue #77): the chart's `worker-hpa` HorizontalPodAutoscaler
# was REMOVED from this manifest. Two autoscalers fighting over the same
# Deployment oscillate (chart HPA is unconditional CPU; ScaledObject
# scales on Redis backlog). Standard KEDA ScaledObject
# (deploy/keda-scaledobject.yaml) is the sole autoscaler for `worker`
# post-#77; install KEDA first (`scripts/install-keda.sh`) and then
# apply the ScaledObject. See docs/kind-validation.md step 4 for the
# end-to-end recipe. The pre-#77 chart overlay that previously left the
# HPA in place is no longer needed.
# Digest pinning (issue #172): see `04-web.yaml` for the rationale; the
# `nrel/openstudio-server:3.11.0@…` digest is the same across web /
# web-background / worker so the three pods always pull the same image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: openstudio-server
  labels:
    app: worker
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: nrel/openstudio-server:3.11.0@sha256:de95093868fe2f7e382e29995a72936b2ab95627e653d8ac4a9df1bf3667a975
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/start-workers"]
          env:
            - name: QUEUES
              value: requeued,simulations
            - name: COUNT
              value: "1"
            - name: SECRET_KEY_BASE
              value: c4ab6d293e4bf52ee92e8dda6e16dc9b5448d0c5f7908ee40c66736d515f3c29142d905b283d73e5e9cef6b13cd8e38be6fd3b5e25d00f35b259923a86c7c473
            - name: REDIS_URL
              value: redis://:openstudio-rotated@queue:6379
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: openstudio-mongo
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openstudio-mongo
                  key: password
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Creating kill.worker file" >&2
                    touch /opt/openstudio/server/bin/kill.worker
                    echo "Sending QUIT signal to Resque" >&2
                    pkill -f -QUIT resque || true
                    echo "Waiting for Ruby or OpenStudio processes to end (max 50s)" >&2
                    timeout=50
                    while [ $timeout -gt 0 ] && ( [ $(eval "pgrep -c ruby") -gt 1 ] || [ $(eval "pgrep -c openstudio") -gt 0 ] ); do
                      sleep 2
                      echo "Still waiting... ($timeout seconds remaining)" >&2
                      timeout=$((timeout-2))
                    done
                    echo "Killing remaining processes" >&2
                    pkill -P 1 || true
          volumeMounts:
            - name: osdata-worker
              mountPath: /mnt/openstudio
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      terminationGracePeriodSeconds: 5200
      volumes:
        - name: osdata-worker
          emptyDir: {}
