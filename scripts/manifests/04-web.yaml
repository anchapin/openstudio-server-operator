# Web — mirrors the helm chart's `web` Deployment + `web` Service (:80).
# Image is pinned to nrel/openstudio-server:3.11.0 — the version the operator
# targets (AGENTS.md; the chart default 3.8.0-1 is NOT the target).
# Digest pinning (issue #172): the kind recipe is the project's validation
# target (D13); image-boundary digests are pinned to close the supply-chain
# drift gap that #113/#124 closed for the operator / rclone / python images.
# Tag stays at 3.11.0 (operator contract); only the digest moves. Renew via
# `docker buildx imagetools inspect nrel/openstudio-server:3.11.0`.
#
# Env/command replicated from the chart's web-deploy.yaml (develop branch):
#   command: bash -c "/usr/local/bin/rails-entrypoint && /usr/local/bin/start-server"
#   QUEUES=analysis_wrappers  (web also runs one Resque worker for this queue)
#   REDIS_URL=redis://:openstudio-rotated@queue:6379
#     (issue #150 — was the legacy literal 'openstudio'; rotated via
#      scripts/rotate_redis_password.sh per-cluster before apply)
#   MONGO_USER/MONGO_PASSWORD via valueFrom.secretKeyRef -> openstudio-mongo
#     Secret (issue #219 — was the legacy literal 'openstudio'/'openstudio';
#     rotated via scripts/rotate_mongo_password.sh per-cluster before apply.
#     mongoid auth_source admin, host db:27017)
#   SECRET_KEY_BASE — the chart's committed default (upstream public value, not a secret)
# Scaled-minimal: MAX_REQUESTS/MAX_POOL/OS_SERVER_NUMBER_OF_WORKERS tuned down
# from the chart's production formulas for a single-node kind cluster.
#
# APPENDIX (deltas vs chart, documented in docs/kind-validation.md):
#   * readinessProbe httpGet / :80 kept; livenessProbe (grep /proc/mounts for
#     /mnt/openstudio) dropped — the hostPath mount satisfies it, and fewer
#     probes = fewer failure modes for an API-validation environment.
#   * No load_balancer / web-hpa (web replicas pinned to 1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: openstudio-server
  labels:
    app: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Issue #388 — PSS `restricted` hardening. The web pod mounts
      # `MONGO_USER` / `MONGO_PASSWORD` / `REDIS_URL` from Secrets, so a
      # CVE in the pinned `nrel/openstudio-server:3.11.0` digest running
      # as root pivots straight into the database. The pod-level block
      # mirrors deploy/operator-deployment.yaml:47-52 and
      # deploy/storage-cronjob.yaml:112-117 (runAsNonRoot + runAsUser
      # 1000 + seccompProfile RuntimeDefault + fsGroup 1000). fsGroup 1000
      # makes the nfs-pvc mount writable by the non-root UID the
      # container runs as.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: web
          image: nrel/openstudio-server:3.11.0@sha256:de95093868fe2f7e382e29995a72936b2ab95627e653d8ac4a9df1bf3667a975
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/usr/local/bin/rails-entrypoint && /usr/local/bin/start-server"]
          ports:
            - containerPort: 80
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: "1"
            - name: QUEUES
              value: analysis_wrappers
            - name: SECRET_KEY_BASE
              value: c4ab6d293e4bf52ee92e8dda6e16dc9b5448d0c5f7908ee40c66736d515f3c29142d905b283d73e5e9cef6b13cd8e38be6fd3b5e25d00f35b259923a86c7c473
            - name: REDIS_URL
              value: redis://:openstudio-rotated@queue:6379
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: openstudio-mongo
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openstudio-mongo
                  key: password
            - name: MAX_REQUESTS
              value: "50"
            - name: MAX_POOL
              value: "4"
          # Issue #388 — container-level PSS `restricted` baseline matching
          # deploy/operator-deployment.yaml:95-103 and
          # deploy/storage-cronjob.yaml:162-170. readOnlyRootFilesystem
          # requires writable /tmp for Rails / Resque buffering — the
          # emptyDir volume below provides it. Mounting the nfs-pvc at
          # /mnt/openstudio is unaffected (the PVC carries its own
          # fsGroup-owned writability via the pod-level fsGroup above).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nfs
              mountPath: /mnt/openstudio
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs-pvc
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: openstudio-server
spec:
  selector:
    app: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
