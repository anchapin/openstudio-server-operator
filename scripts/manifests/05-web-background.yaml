# web_background — mirrors the helm chart's `web-background` Deployment.
# Same 3.11.0 image, QUEUES=background,analyses, and the chart's command
# (resque:workers scaled by COUNT). OS_SERVER_NUMBER_OF_WORKERS is tuned down
# from the chart's 30 to 2 for kind. Mounts the nfs-pvc stand-in like the
# chart does.
# Digest pinning (issue #172): see `04-web.yaml` for the rationale; the
# `nrel/openstudio-server:3.11.0@…` digest is the same across web /
# web-background / worker so the three pods always pull the same image.
# (resque:workers scaled by COUNT). OS_SERVER_NUMBER_OF_WORKERS is tuned down
# from the chart's 30 to 2 for kind. Mounts the nfs-pvc stand-in like the
# chart does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-background
  namespace: openstudio-server
  labels:
    app: web-background
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-background
  template:
    metadata:
      labels:
        app: web-background
    spec:
      # Issue #388 — PSS `restricted` hardening. Mirrors
      # scripts/manifests/04-web.yaml (same Rails image, same Secret
      # mounts, same fsGroup-owned NFS PVC).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: web-background
          image: nrel/openstudio-server:3.11.0@sha256:de95093868fe2f7e382e29995a72936b2ab95627e653d8ac4a9df1bf3667a975
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - cd /opt/openstudio/server && COUNT=${OS_SERVER_NUMBER_OF_WORKERS} bundle exec rake environment resque:workers
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: "2"
            - name: QUEUES
              value: background,analyses
            - name: SECRET_KEY_BASE
              value: c4ab6d293e4bf52ee92e8dda6e16dc9b5448d0c5f7908ee40c66736d515f3c29142d905b283d73e5e9cef6b13cd8e38be6fd3b5e25d00f35b259923a86c7c473
            - name: REDIS_URL
              value: redis://:openstudio-rotated@queue:6379
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: openstudio-mongo
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openstudio-mongo
                  key: password
          # Issue #388 — container-level PSS `restricted` baseline matching
          # deploy/operator-deployment.yaml:95-103 and
          # deploy/storage-cronjob.yaml:162-170. readOnlyRootFilesystem
          # requires writable /tmp for Rails / Resque buffering — the
          # emptyDir volume below provides it.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nfs
              mountPath: /mnt/openstudio
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs-pvc
        - name: tmp
          emptyDir: {}
