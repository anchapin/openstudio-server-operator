name: Release

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Issue #701: the pin step opens + auto-merges the re-pin PR (the bot
  # cannot push develop directly under the ruleset).
  pull-requests: write
  packages: write
  # id-token: write is required for cosign keyless signing (Sigstore Fulcio).
  # Without this permission the cosign sign step would fail with
  # `failed to get OIDC token`.
  id-token: write
  # attestations: write is required for the in-toto attestations generated
  # by docker/build-push-action when provenance/sbom are enabled.
  attestations: write

env:
  IMAGE_NAME: ghcr.io/anchapin/openstudio-server-operator

jobs:
  publish-dev:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      # Issue #149: the digest published for the dev image, as a job-level
      # output for downstream tooling. `steps.build.outputs.digest` is the
      # image manifest digest emitted by docker/build-push-action@v5; for
      # a single-platform build (linux/amd64) that is also the value
      # kubectl pins via `@sha256:...`. For a multi-platform build the
      # action emits the image-index digest; Kubernetes ≥ 1.25 honors that
      # form across platforms.
      image-digest: ${{ steps.pin.outputs.image-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Issue #113/#124: enable SLSA-level provenance, SBOM generation, and
      # digest capture. The buildx action writes the SLSA provenance +
      # SPDX SBOM into the image as OCI attestations under `sha256-...`.
      - name: Build + publish (with provenance, SBOM, digest capture)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:dev
          provenance: mode=max
          sbom: true
      # Issue #479: assert the production image carries no dev dependencies.
      # The Dockerfile installs from requirements.txt (runtime-only lockfile);
      # this docker-run check is the release-time backstop for the PR-time
      # tests/test_dependency_drift.py guard (which inspects the lockfile
      # text, not the built image). Runs BEFORE the digest-pin commit so a
      # leaked dev dep can never be pinned into deploy/ manifests.
      - name: Assert no dev deps in the runtime image (issue #479)
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint python "${IMAGE_NAME}@${DIGEST}" -c \
            "import importlib.util as u; assert not any(u.find_spec(m) for m in ['pytest','hypothesis','responses','fakeredis','ruff']), 'dev deps leaked into runtime image'"
      # Issue #481: trivy scan of the actually-pushed image, BEFORE the
      # digest-pin commit below — a CRITICAL/HIGH finding fails the job so
      # a vulnerable layer set can never be pinned into the deploy/
      # manifests (same placement rationale as the #479 dev-dep assert:
      # the pin step must be the last thing that runs). Same severity
      # floor and .trivyignore triage file as the PR-time scan in ci.yml;
      # scanning by digest pins the exact layer set just pushed.
      - name: Trivy scan the pushed image (CRITICAL,HIGH gate, issue #481)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore
          ignore-unfixed: true
      # Issue #113: cosign keyless sign against the digest just published,
      # using GitHub Actions OIDC (no long-lived key). Pushes the signature
      # to the public Sigstore transparency log + the GHCR signature store.
      # Issue #588: sign + attest + the digest-pinned verify below all run
      # BEFORE the digest-pin commit (the last step of this job) — a sign
      # failure fails the job here, so develop can never be committed to an
      # unsigned, unverified digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign + attest the dev image
        env:
          COSIGN_EXPERIMENTAL: "true"
          # Issue #574: github.* values reach the shell only via env
          # vars — never interpolated directly into a `run:` string
          # (expression injection; fenced by
          # scripts/check_workflow_run_injections.py).
          GH_REF: ${{ github.ref }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "ERROR: buildx did not emit a digest; cannot sign."
            exit 1
          fi
          # Issue #155: generate the SLSA provenance predicate inline via jq
          # rather than referencing a committed release-slsa.json file
          # (which never existed in the repo; that was the original bug).
          # Issue #456: the file passed to `cosign attest --predicate` must
          # be the BARE PREDICATE, not a full in-toto Statement — cosign
          # unmarshals it directly into the SLSA v0.2 ProvenancePredicate
          # struct and constructs the Statement envelope (type/predicateType/
          # subject) itself, deriving the subject from the image ref + digest
          # on the CLI. Feeding a Statement nests `builder` one level too
          # deep and fails with `required field builder missing`. The v0.2
          # json tags make `builder` + `buildType` the required top-level
          # fields. Output goes to /tmp because the runner cleans that up
          # automatically.
          jq -n \
            --arg ref "${GH_REF}" \
            --arg repo "${GH_REPO}" \
            --arg sha "${GH_SHA}" \
            --arg run_id "${GH_RUN_ID}" \
            '{
              "builder": {
                "id": ("https://github.com/" + $repo + "/.github/workflows/release.yml@" + $ref)
              },
              "buildType": "https://slsa.dev/github-actions-run/v1",
              "invocation": {
                "configSource": {
                  "uri": ("git+https://github.com/" + $repo + "@" + $ref),
                  "digest": {"sha1": $sha},
                  "entryPoint": ".github/workflows/release.yml"
                },
                "environment": {"runner": "github-hosted"}
              },
              "metadata": {
                "buildInvocationID": ("https://github.com/" + $repo + "/actions/runs/" + $run_id),
                "completeness": {"parameters": true, "environment": true, "materials": true},
                "reproducible": false
              },
              "materials": [{
                "uri": ("git+https://github.com/" + $repo + "@" + $ref),
                "digest": {"sha1": $sha}
              }]
            }' > /tmp/release-slsa.json
          cosign sign --yes "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"
          cosign attest --yes --predicate /tmp/release-slsa.json \
            --type slsaprovenance \
            "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"
      # Issue #113 CI guard: fail the release if the published `:dev`
      # image carries no SLSA provenance attestation.
      # Issue #169: pin certificate identity to the exact workflow + ref that
      # produced the attestation (release.yml@refs/heads/develop), not a regex
      # that would match any workflow from this repo. Use the exact-match
      # --certificate-identity and --certificate-oidc-issuer flags because the
      # OIDC issuer is a fixed string (Sigstore Fulcio).
      # Issue #588: verify the EXACT digest this run just signed
      # (`@${DIGEST}`), not the mutable `:dev` tag — the tag form proved
      # only "whatever :dev resolves to now", which during a rerun race
      # could be a different (stale) artifact. This in-workflow check is
      # the fast feedback loop; the truly INDEPENDENT verification (the
      # #159 rationale: this step lives in the same workflow that signed,
      # so a malicious same-edit removal of sign+verify is only caught
      # elsewhere) is ci.yml's workflow_run-gated
      # `cosign-verify-dev-image` job. Runs BEFORE the digest-pin commit
      # below for the same reason as the #479/#481 gates: an unsigned
      # digest can never be pinned into deploy/.
      - name: Verify provenance (digest-pinned)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "ERROR: buildx did not emit a digest; cannot verify."
            exit 1
          fi
          cosign verify-attestation \
            --certificate-identity "https://github.com/anchapin/openstudio-server-operator/.github/workflows/release.yml@refs/heads/develop" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type slsaprovenance \
            "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"
      # Issue #149: after the build step resolves the digest, pin
      # deploy/operator-deployment.yaml AND deploy/storage-cronjob.yaml
      # to `@sha256:<digest>` and commit back to develop. The standard
      # pattern, made idempotent: if both manifests already pin this
      # digest, exit 0 without committing (this avoids the auto-commit→
      # auto-rebuild infinite loop the obvious implementation falls into,
      # because the Dockerfile is unchanged and the build deterministically
      # emits the same digest for a given source tree).
      # Issue #588: this step is deliberately the LAST one in the job —
      # after Sign + attest and the digest-pinned verify above (the same
      # placement rationale as the #479 dev-dep assert and the #481 trivy
      # scan): a deliberately-failed sign (the acceptance test) fails the
      # job before this step, so no digest-pin commit can be produced for
      # an unsigned image.
      # Issue #291: storage-cronjob.yaml was historically exempt from
      # this step (the previous comment claimed it "ships its own
      # separate pin") but the manifest was never actually pinned —
      # it used the mutable `:dev` tag with `imagePullPolicy: IfNotPresent`,
      # which let the kubelet retain whatever image was already on the
      # node. Both manifests now pin the same digest in lockstep.
      - name: Pin operator image by SHA256 digest
        id: pin
        env:
          # Issue #574: github.* reaches the shell only via env:.
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "${DIGEST}" ]; then
            echo "ERROR: docker/build-push-action did not emit a digest; cannot pin manifest."
            exit 1
          fi
          echo "image-digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          CURRENT=$(grep -oE '@sha256:[a-f0-9]+' deploy/operator-deployment.yaml | head -1 || true)
          if [ "@${DIGEST}" = "${CURRENT}" ]; then
            echo "deploy/operator-deployment.yaml already pins ${DIGEST}; no commit needed."
            exit 0
          fi
          # Issue #291: pin storage-cronjob.yaml alongside the operator
          # deployment. Both manifests must agree on the digest; the
          # test_cronjob_image_digest_matches_operator_deployment test
          # enforces equality.
          CHANGED=0
          for MANIFEST in deploy/operator-deployment.yaml deploy/storage-cronjob.yaml; do
            sed -i.bak "s|image: ${IMAGE}[:@].*|image: ${IMAGE}@${DIGEST}|" "${MANIFEST}"
            rm -f "${MANIFEST}.bak"
            if ! git diff --quiet "${MANIFEST}"; then
              CHANGED=1
            fi
          done
          if [ "${CHANGED}" = "0" ]; then
            echo "No changes after sed (both manifests already pin the same digest); nothing to commit."
            exit 0
          fi
          # Issue #701: the github-actions bot is NOT a bypass actor on the
          # develop ruleset (require-ci-on-develop-prs), so pushing the
          # develop ref directly is rejected ("required status checks
          # are expected") — the exact failure that silently froze the
          # committed digest at the pre-#149 baseline alongside the #699
          # sed bug. The pin therefore lands via a PR: push a floating
          # bot branch, open a PR (scope-guard-compliant body — the #301
          # lint gate checks it), and enable auto-merge; the required
          # lint+test checks run on the PR and the squash-merge lands the
          # pin once green. If repo-level auto-merge is disabled, the PR
          # simply waits for a one-click owner merge — the digest is
          # still visible + reviewable either way.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/operator-deployment.yaml deploy/storage-cronjob.yaml
          git commit -m "build: refs #149 #291 — pin operator + cronjob image by SHA256 digest (${DIGEST})"
          PIN_BRANCH="bot/digest-repin"
          # Floating branch: force-push the single pin commit on top of the
          # just-checked-out develop head so stale branches can't accumulate.
          git push --force origin "HEAD:refs/heads/${PIN_BRANCH}"
          PR_URL=$(gh pr create --base develop --head "${PIN_BRANCH}" \
            --title "build: pin operator + cronjob image by SHA256 digest (${DIGEST:0:19}…)" \
            --body "Refs #149 #291 #699 #701 — automated digest re-pin from release.yml (publish-dev).

          ## What
          - Re-pins \`deploy/operator-deployment.yaml\` + \`deploy/storage-cronjob.yaml\` to the just-published, signed, trivy-scanned dev image digest \`${DIGEST}\`.

          Scope guard: touches only the two image-digest lines owned by #149/#291; the sed/push mechanics are owned by #701 and nothing else in deploy/ or src/ is unchanged." \
            2>/dev/null || true)
          if [ -n "${PR_URL}" ]; then
            PR_NUMBER="${PR_URL##*/}"
            gh pr merge "${PR_NUMBER}" --auto --squash \
              --subject "build: refs #149 #291 — pin operator + cronjob image by SHA256 digest (${DIGEST})"
            echo "Re-pin PR ${PR_URL} opened with auto-merge enabled."
          else
            # Already-open PR from a prior run: re-target auto-merge on it.
            PR_NUMBER=$(gh pr list --head "${PIN_BRANCH}" --json number --jq '.[0].number')
            if [ -n "${PR_NUMBER}" ]; then
              gh pr merge "${PR_NUMBER}" --auto --squash \
                --subject "build: refs #149 #291 — pin operator + cronjob image by SHA256 digest (${DIGEST})"
              echo "Existing re-pin PR #${PR_NUMBER} re-armed with auto-merge."
            else
              echo "ERROR: could not create or find the re-pin PR." >&2
              exit 1
            fi
          fi

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + publish (versioned, with provenance + SBOM)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      # Issue #479: same dev-dep absence assert as publish-dev — the
      # versioned image must be identical in shape to :dev (no pytest /
      # hypothesis / responses / fakeredis / ruff anywhere in it).
      - name: Assert no dev deps in the runtime image (issue #479)
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint python "${IMAGE_NAME}@${DIGEST}" -c \
            "import importlib.util as u; assert not any(u.find_spec(m) for m in ['pytest','hypothesis','responses','fakeredis','ruff']), 'dev deps leaked into runtime image'"
      # Issue #481: same post-push trivy gate as publish-dev — the
      # versioned tag is what production pulls on a release, so it gets
      # the identical CRITICAL,HIGH floor + .trivyignore triage file
      # before it is signed and released.
      - name: Trivy scan the pushed image (CRITICAL,HIGH gate, issue #481)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore
          ignore-unfixed: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign + attest the versioned image
        env:
          COSIGN_EXPERIMENTAL: "true"
          # Issue #574: same env-var indirection as the dev sign step —
          # github.* values never interpolate directly into run:.
          GH_REF: ${{ github.ref }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          # Issue #155: generate the SLSA provenance predicate inline via jq
          # rather than referencing a committed release-slsa.json file
          # (which never existed in the repo; that was the original bug).
          # Issue #456: the file passed to `cosign attest --predicate` must
          # be the BARE PREDICATE, not a full in-toto Statement — cosign
          # unmarshals it directly into the SLSA v0.2 ProvenancePredicate
          # struct and constructs the Statement envelope (type/predicateType/
          # subject) itself, deriving the subject from the image ref + digest
          # on the CLI. Feeding a Statement nests `builder` one level too
          # deep and fails with `required field builder missing`. The v0.2
          # json tags make `builder` + `buildType` the required top-level
          # fields. Output goes to /tmp because the runner cleans that up
          # automatically.
          jq -n \
            --arg ref "${GH_REF}" \
            --arg repo "${GH_REPO}" \
            --arg sha "${GH_SHA}" \
            --arg run_id "${GH_RUN_ID}" \
            '{
              "builder": {
                "id": ("https://github.com/" + $repo + "/.github/workflows/release.yml@" + $ref)
              },
              "buildType": "https://slsa.dev/github-actions-run/v1",
              "invocation": {
                "configSource": {
                  "uri": ("git+https://github.com/" + $repo + "@" + $ref),
                  "digest": {"sha1": $sha},
                  "entryPoint": ".github/workflows/release.yml"
                },
                "environment": {"runner": "github-hosted"}
              },
              "metadata": {
                "buildInvocationID": ("https://github.com/" + $repo + "/actions/runs/" + $run_id),
                "completeness": {"parameters": true, "environment": true, "materials": true},
                "reproducible": false
              },
              "materials": [{
                "uri": ("git+https://github.com/" + $repo + "@" + $ref),
                "digest": {"sha1": $sha}
              }]
            }' > /tmp/release-slsa.json
          cosign sign --yes "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"
          cosign attest --yes --predicate /tmp/release-slsa.json \
            --type slsaprovenance \
            "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"
      # Issue #169: pin certificate identity to the exact workflow + ref
      # that produced the attestation (release.yml@refs/tags/v*). Note the
      # `v*` glob is part of the cosign identity check, not a shell glob.
      - name: Verify provenance exists
        env:
          COSIGN_EXPERIMENTAL: "true"
          # Issue #574: env-var indirection — github.ref_name (tag names
          # may carry shell metacharacters) must not hit run: directly.
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          cosign verify-attestation --certificate-identity "https://github.com/anchapin/openstudio-server-operator/.github/workflows/release.yml@refs/tags/v*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type slsaprovenance \
            "ghcr.io/anchapin/openstudio-server-operator:${GH_REF_NAME}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
