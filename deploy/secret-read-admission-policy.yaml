# Issue #572 — admission-layer fence for the #463 bounded secrets
# exception: the operator ServiceAccount's Secret access is narrowed to
# the `openstudio-redis*` naming convention.
#
# Threat model (same namespace-compromise shape as #293/#294): the RBAC
# grant for the #463 exception is `secrets: [get]` with no object-name
# constraint (deploy/rbac.yaml) — namespace-wide. The only things
# bounding it are the operator's own code (client_factory reads exactly
# ONE Secret, named by spec.redisCredentials.secretRef) and the CRD
# pattern `^openstudio-redis[a-z0-9-]*$` on that field. Neither
# constrains a COMPROMISED operator pod: with the SA token it can `get`
# ANY Secret in `openstudio-server` — the Mongo credentials, the rclone
# archival cloud credentials, TLS CA bundles, metrics bearer tokens,
# and every helm-managed Secret. Native RBAC cannot close that itself:
# a PolicyRule has no name-PATTERN slot (`resourceNames` is an
# exact-name list, useless for a CR-configurable target), which is the
# same RBAC-shape reasoning deploy/rbac.yaml's #463 comment block and
# the #293 policy document for label selectors.
#
# SCOPE HONESTY — what a ValidatingAdmissionPolicy can and cannot fence
# here (read this before "fixing" the operations list):
#
#   * The kube-apiserver's admission chain — webhooks and CEL
#     ValidatingAdmissionPolicies alike — runs ONLY on the mutating
#     request path. `matchConstraints.resourceRules.operations` accepts
#     exactly CREATE, UPDATE, DELETE, CONNECT (plus "*"); a literal
#     "GET" is an Invalid reject at apply time — a dead manifest, the
#     exact failure mode #565 closed for the first two policies. Read
#     verbs (get/list/watch) are authorized by RBAC and served without
#     ever reaching admission, so NO admission object can intercept
#     `get secret`.
#   * The operator SA's read path is therefore bounded today by:
#     (1) RBAC grants `get` ONLY on secrets (no list/watch) — a reader
#     must already know the exact name; (2) the CRD pattern pins the
#     only name the operator's single construction site
#     (client_factory._resolve_redis_url) will ever read; (3) the #390
#     in-cluster URL fence constrains the resolved value. Closing the
#     GET path itself against a compromised pod would require moving
#     name-scoped reads out of the operator process or an authorization
#     webhook — neither is expressible as a ValidatingAdmissionPolicy.
#   * What THIS policy fences: the operator SA's MUTATING surface on
#     Secrets, name-gated to the `openstudio-redis*` convention. Today
#     the Role holds `get` only, so a Secret write from this SA is
#     refused by RBAC before admission ever runs — this policy is not
#     what stops writes today. What it buys is independence from the
#     Role: if the secrets rule is ever widened (create/update/delete,
#     e.g. a future credential-rotation feature), admission already
#     enforces the naming convention, and the deny direction is the
#     safe one — under `failurePolicy: Fail` a CEL runtime error or an
#     empty `request.name` (server-named CREATE) REJECTS the request.
#
# The CEL short-circuit `request.userInfo.username != '<operator SA>'
# || request.name.startsWith('openstudio-redis')` leaves every other
# actor untouched — humans via kubectl, the prune CronJob SA, helm —
# exactly the #293 carve-out shape. `request.name` is populated for
# UPDATE/DELETE (and client-named CREATEs) on single-object requests.
#
# Requires K8s 1.30+ (admissionregistration.k8s.io/v1 GA) — the same
# prerequisite as the #293 pod-delete policy; pre-1.30 clusters must
# skip all three VAPs (see AGENTS.md). Apply alongside the rest of the
# operator manifests (docs/kind-validation.md Phase A ordering).

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openstudio-operator-secret-read-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        # CREATE/UPDATE/DELETE only — the complete set of mutating
        # operations the admission system can see on Secrets (CONNECT
        # does not exist for Secrets; GET/LIST/WATCH never reach
        # admission — see the SCOPE HONESTY block above). The operator
        # process holds no Secret write verb today; this rule is the
        # RBAC-drift fence that stays load-bearing if the Role's
        # secrets verbs are ever widened (#572).
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openstudio-server
  validations:
    - expression: >
        request.userInfo.username !=
        'system:serviceaccount:openstudio-server:openstudio-operator-sa'
        ||
        request.name.startsWith('openstudio-redis')
      # Issue #565: the message MUST be a single line — the API server
      # rejects any validation message containing "\n" ("message must
      # not contain line breaks"). The folded `>-` scalar (strip-
      # chomped) yields exactly one line with no trailing newline.
      message: >-
        openstudio-operator-sa may only mutate Secrets named
        openstudio-redis* (the CRD-pinned naming convention for
        spec.redisCredentials.secretRef). All other Secret mutations
        from this ServiceAccount are rejected at admission time
        (issue #572, companion to the #463 secrets exception). Humans
        via kubectl and other ServiceAccounts are unaffected.
---
# ValidatingAdmissionPolicyBinding scopes the cluster-scoped policy
# to the `openstudio-server` namespace via namespaceSelector (which
# is additive with the policy's own matchConstraints.namespaceSelector
# — both must match for the policy to evaluate a request).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openstudio-operator-secret-read-scope
spec:
  policyName: openstudio-operator-secret-read-scope
  # Issue #565: `validationActions` is REQUIRED on a v1
  # ValidatingAdmissionPolicyBinding — the API server rejects an
  # omitted/empty list ("at least one validation action is
  # required"). `Deny` is the only action that actually blocks the
  # request; `Warn`/`Audit` alone would leave the #572 fence dormant.
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openstudio-server
