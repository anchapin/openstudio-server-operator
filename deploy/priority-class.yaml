# Issue #414 — PriorityClass for the operator Deployment + prune CronJob
# (node-pressure protection).
#
# The operator is single-replica with `strategy: Recreate`
# (deploy/operator-deployment.yaml) — one active poller, no leader
# election. During a node-pressure eviction the kubelet can evict the
# operator pod mid-tick, leaving the StatusStore read-modify-write
# half-applied and a `web_background_restart_pending` flag stuck in
# `.status` (D04). The prune CronJob (deploy/storage-cronjob.yaml) has
# the same exposure mid-retention-tick. Pre-fix neither manifest
# declared `priorityClassName`, so the operator inherited whatever the
# cluster default happened to be — and that default diverges across
# control planes (kops/eks/gke each behave differently).
#
# This PriorityClass makes the operator + prune pods the LAST pods
# evicted during node pressure: value 1000000000 sits above every
# user workload while staying below the system-reserved band
# (system-cluster-critical / system-node-critical at 2x10^9).
# `preemptionPolicy: Never` keeps the scheduler from preempting OTHER
# pods to make room for the operator on a full cluster — protection
# here is eviction-ordering only, not scheduling priority over
# existing workloads. `globalDefault: false` ensures pods that do not
# opt in are untouched.
#
# Deliberately ONE PriorityClass shared by both the operator
# Deployment and the prune CronJob (issue #414 scope guard: "Do NOT
# add multiple PriorityClasses"). Archival Jobs generated by
# archival.py do NOT set priorityClassName — they stay at the cluster
# default so rclone archival pods remain evictable first under
# pressure; that contrast is what keeps archival Jobs evicting before
# the operator surface.
#
# PriorityClass is cluster-scoped (scheduling.k8s.io/v1) — unlike the
# namespaced deploy/ manifests it carries no `metadata.namespace`. A
# cluster admin can apply this file alongside 00-namespace.yaml
# before the operator + prune manifests; the pods reference it by
# name via `priorityClassName` at admission time.

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: openstudio-operator-critical
value: 1000000000
globalDefault: false
preemptionPolicy: Never
description: >-
  Issue #414 — node-pressure protection for the openstudio-server
  operator Deployment and storage-prune CronJob pods. Single-replica +
  Recreate posture means a mid-tick eviction halts the operator with a
  half-applied StatusStore RMW; this class makes those pods the last
  evicted. preemptionPolicy: Never so the operator never displaces
  other pods; globalDefault: false so nothing inherits it implicitly.
