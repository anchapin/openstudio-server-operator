# Storage-prune CronJob (issue #78) — the retention pipeline as a native Job
# primitive, out of the operator core process.
#
# What runs here: `python -m openstudio_operator.prune_entrypoint` — ONE
# `openstudio_operator.retention.run_retention_tick` against the OLDEST OSCM
# CR (D05), honoring that CR's `spec.dryRun` (D11) and anchoring all state in
# its `.status.archivedAnalyses` (D04). The pipeline ordering is unchanged:
# retention eligibility → verified archival (`rclone check` gate) →
# `DELETE /analyses/{id}` (server-side NFS cascade). This is deliberately NOT
# a disk-watermark deleter — see docs/architecture-plan.md Module 4.
#
# Schedule: */10 matches the 600 s cadence of the operator timer this
# replaces. The schedule is a property of this manifest (kubectl edit here),
# not a CRD field — nothing in the operator reads it (config purity).
#
# Image: reuses the operator image (published on every develop push); the
# entrypoint ships inside the package. Versioned releases publish v* tags.
#
# RBAC: the ServiceAccount below holds ONLY what one tick needs — no
# Deployments/Pods/HPA/Secrets access, no NFS mounts (the archival Jobs it
# spawns carry their own envFrom creds and PVC mounts). The operator's Role
# (deploy/rbac.yaml) lost its entire batch/jobs rule in exchange (#78).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openstudio-storage-pruner-sa
  namespace: openstudio-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstudio-storage-pruner-role
  namespace: openstudio-server
rules:
  # Resolve the active (oldest) OSCM CR — D05, same rule as the operator guard
  - apiGroups: ["energy.nrel.gov"]
    resources: ["openstudioclustermanagers"]
    verbs: ["list"]
  # StatusStore read-modify-write on .status.archivedAnalyses (D04 anchors)
  - apiGroups: ["energy.nrel.gov"]
    resources: ["openstudioclustermanagers/status"]
    verbs: ["get", "patch"]
  # Archival Job spawn (create), watch-by-deterministic-name (get) and
  # failed-Job cleanup (delete) — the same verbs the operator Role used to hold.
  # Issue #294: these verbs alone scope the prune SA to `batch/jobs` with NO
  # constraint on Job name or label — a compromised prune pod could spawn
  # arbitrary Jobs (any image, any service account, including one that
  # exfiltrates cluster credentials). The constraint that Jobs must be
  # archival-labelled AND named `oscm-archive-*` is enforced by the
  # ValidatingAdmissionPolicy below (issues #294, #398); the RBAC list
  # above stays the same shape because RBAC `PolicyRule` has no
  # `labelSelector` and `resourceNames` only accepts exact strings (no
  # globs).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  # Dry-run markers + archival lifecycle Events on the CR (D11 observability)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstudio-storage-pruner-rb
  namespace: openstudio-server
subjects:
  - kind: ServiceAccount
    name: openstudio-storage-pruner-sa
    namespace: openstudio-server
roleRef:
  kind: Role
  name: openstudio-storage-pruner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openstudio-storage-pruner
  namespace: openstudio-server
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: storage-pruner
spec:
  schedule: "*/10 * * * *"
  # Single-flight: never two concurrent ticks (the deterministic Job names,
  # 409-conflict spawn and 409-retried status RMW already make overlap safe,
  # but Forbid keeps every run's observable history clean).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The entrypoint already implements skip-and-retry-next-schedule (D12);
      # in-place pod retries add nothing.
      backoffLimit: 0
      # Issue #569 — upper bound on one tick's wall-clock time: the #394
      # archival-Job pattern (archival.py::
      # ARCHIVAL_JOB_ACTIVE_DEADLINE_SECONDS) applied to the prune side,
      # sized off a reference cadence instead of waiting forever. #394
      # used 6x the chart's worker terminationGracePeriodSeconds (5200s)
      # because a healthy multi-GB rclone upload runs for hours; here the
      # reference is the schedule itself (600s, matched above) because a
      # tick is orchestration-only — retention NEVER blocks on archival
      # Job completion (in-flight Jobs are observed tick-spaced, see
      # retention.py "still running — keep watching"), so this deadline
      # cannot race a legitimate upload (those carry their own 31200s
      # #394 deadline inside the rclone pod). A worst-case healthy tick —
      # 3x REST retry budget with jittered backoff + the once-per-tick
      # heavy data_points poll + archival Job spawns — finishes in
      # single-digit minutes; 1800s = 3 full schedule intervals absorbs
      # that with room to spare. The hang this bounds: the kubernetes
      # python client sets NO read timeout, so an apiserver/Redis stall
      # or a black-holed TCP connection pins the pod in Running forever;
      # with concurrencyPolicy: Forbid every subsequent */10 schedule is
      # then skipped and retention dies silently (the Job never reaches
      # Failed, so OpenStudioOperatorPruneJobFailed never fires —
      # kube_job_status_failed stays 0 by construction). The kubelet
      # hard-kills the pod at the deadline and marks the Job Failed
      # (DeadlineExceeded) — at most two skipped schedules — which the
      # failed-Job alert then pages on. The complementary
      # absence-of-success alert (deploy/prometheustrule.yaml, also
      # #569) covers the no-event modes a deadline cannot reach
      # (suspended CronJob, Jobs never scheduled).
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: openstudio-operator
            app.kubernetes.io/component: storage-pruner
        spec:
          serviceAccountName: openstudio-storage-pruner-sa
          restartPolicy: Never
          # Issue #414 — node-pressure protection: a mid-tick eviction
          # strands a retention tick (D12 makes the next schedule retry
          # safe, but the archival Job watch loses its spawner). Same
          # openstudio-operator-critical PriorityClass as the operator
          # Deployment (deploy/priority-class.yaml) — one class covers
          # both, per the issue's scope guard. The archival Jobs this
          # entrypoint spawns (archival.py) do NOT set priorityClassName
          # so rclone pods remain evictable first under pressure.
          priorityClassName: openstudio-operator-critical
          # Issue #162 — pod-level defense-in-depth baseline (matches the
          # operator Deployment at deploy/operator-deployment.yaml:48-56 and
          # the rclone Job emitted by archival.py:225-232). runAsNonRoot +
          # runAsUser block a compromised entrypoint from running as root;
          # seccompProfile.runtime-default is the seccomp filter the operator
          # and rclone Job already enforce. fsGroup 1000 makes the emptyDir
          # /tmp mount writable by the non-root UID the container runs as.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            fsGroup: 1000
          containers:
            - name: prune
              # Issue #291: pin to the same SHA256 digest as deploy/operator-deployment.yaml.
              # The mutable `:dev` tag combined with `IfNotPresent` allowed the kubelet to
              # retain whatever image was already on the node — a swap to a malicious image
              # would silently persist across restarts because the digest-pinning invariant
              # is the regression fence for both manifests.
              image: ghcr.io/anchapin/openstudio-server-operator@sha256:6681d2545970ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e
              imagePullPolicy: Always
              command: ["python", "-m", "openstudio_operator.prune_entrypoint"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # Issue #478 — optional bearer-token authN for the prune
                # CronJob's /metrics endpoint, at parity with the operator
                # Deployment's #401 hook (deploy/operator-deployment.yaml):
                # the same env var, the same fail-closed 401 semantics.
                # prune_entrypoint.main() calls the shared
                # metrics.start_metrics_server(), which reads this env var
                # — set to a readable token file, the endpoint demands
                # ``Authorization: Bearer <token>`` and 401s otherwise.
                # Default empty = open plaintext gated only by the
                # ``openstudio-storage-pruner-metrics-ingress``
                # NetworkPolicy (also #478-hardened to the #295 label-
                # scoped selector); do NOT make the token mandatory. To
                # enable per-cluster:
                #   1. kubectl -n openstudio-server create secret generic \
                #        openstudio-pruner-metrics-token --from-literal=token=<secret>
                #   2. uncomment the metrics-token volumeMount + volume below,
                #   3. set this value to /var/run/openstudio-pruner-metrics/token.
                # The server re-reads the token file on every request, so
                # Secret rotation takes effect without waiting for the next
                # tick; a missing or empty file fails CLOSED (every
                # /metrics request 401s).
                - name: OPENSTUDIO_METRICS_TOKEN_FILE
                  value: ""
              # Issue #306 — expose the plaintext Prometheus endpoint on the
              # conventional /metrics port (METRICS_PORT=9090). The prune
              # entrypoint calls start_metrics_server() at the top of main()
              # so the CronJob pod now exposes ANALYSES_ARCHIVED_TOTAL,
              # ANALYSES_DELETED_TOTAL (retention.py:316, 394, 441), and the
              # new PRUNE_TICK_FAILURES_TOTAL{reason} counter that the two
              # skip-tick branches (CR list failure + D12 exception tuple)
              # and the exit-3 empty-redisUrl guard (#392) bump. The endpoint is gated by the parallel
              # ``openstudio-storage-pruner-metrics-ingress`` NetworkPolicy
              # in deploy/network-policy.yaml — same Prometheus-style
              # allow-list (namespace-matched scraper + same-namespace peer)
              # used for the operator's /metrics (#166). Cluster admins
              # whose scraper namespace is not named ``prometheus`` must
              # edit the namespaceSelector label in that policy (see
              # AGENTS.md "Working rules").
              ports:
                - name: metrics
                  containerPort: 9090
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              # Issue #162 — prune container hardening baseline. Mirrors the
              # operator's #115 baseline so a pod compromised via the prune
              # entrypoint cannot escalate, mount writable /, or escape the
              # default seccomp filter. PSS `restricted` accepts this shape.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                # Issue #478 — uncomment together with the metrics-token
                # volume below AND the OPENSTUDIO_METRICS_TOKEN_FILE env
                # value above to enable bearer-token authN on the pruner's
                # /metrics (same opt-in shape as the operator Deployment's
                # #401 pair — the default ships WITHOUT this mount so the
                # CronJob schedules on clusters where the Secret does not
                # exist; a live secretName reference to a missing Secret
                # would block pod scheduling (FailedMount)):
                # - name: metrics-token
                #   mountPath: /var/run/openstudio-pruner-metrics
                #   readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            # Issue #478 — uncomment together with the metrics-token
            # volumeMount above AND the OPENSTUDIO_METRICS_TOKEN_FILE env
            # value above:
            # - name: metrics-token
            #   secret:
            #     secretName: openstudio-pruner-metrics-token
            #     items:
            #       - key: token
            #         path: token
---
# Issue #294 — ValidatingAdmissionPolicy that constrains the prune SA's
# `batch/jobs create|delete` verbs to Jobs that carry the archival labels.
#
# Why this exists: RBAC `PolicyRule` does NOT support `labelSelector`
# and `resourceNames` only accepts exact strings (no globs), so the prune
# SA's Role rule at lines 45-47 cannot express the constraint "only Jobs
# whose name is `oscm-archive-*`" in RBAC alone. A compromised prune pod
# (running on the `*/10` schedule with the cluster's API token) could
# therefore spawn a Job with any name, any image, any service account —
# exfiltrating the cluster's Redis/Mongo/TLS credentials via a different
# `envFrom` secretRef.
#
# The acceptance criterion (#294) lists three options:
#   1. RBAC `labelSelector` — NOT supported by the RBAC v1 API.
#   2. RBAC `resourceNames: [oscm-archive-*]` — glob wildcards NOT
#      supported by `resourceNames`; only exact strings.
#   3. ValidatingAdmissionPolicy — the only API that can express the
#      "must be archival-labelled" constraint declaratively.
#
# This policy is cluster-scoped (ValidatingAdmissionPolicy lives at
# cluster scope) but its `namespaceSelector` narrows it to the
# `openstudio-server` namespace only. `failurePolicy: Fail` makes any
# CEL evaluation error block the request — the same default-deny
# stance the network policies use. The CEL expression uses `has()` to
# guard the `object` vs `oldObject` fields that VAP exposes per
# operation (CREATE has `object`, DELETE has `oldObject`, UPDATE has
# both); without the guard, a CREATE would error on `oldObject`
# evaluation and the policy would reject every legitimate archival Job.
# GET is intentionally left unbound — Reads are not part of the
# exfiltration path and constraining them would also block the prune
# pod's own watch-by-deterministic-name lookup.
#
# Issue #398 — the label match alone is spoofable by the very SA this
# policy constrains: a compromised prune pod can stamp the two archival
# labels on ANY Job it spawns, and `metadata.name` was not part of the
# CEL rule (a Job named `kube-system-cleanup` with the right labels
# passed). The rule therefore ALSO requires
# `metadata.name.startsWith("oscm-archive-")` on both the `object` and
# `oldObject` clauses — the deterministic-name convention of
# `archival.py::archival_job_name`
# (`oscm-archive-<sanitized-id>-<sha256-8>`), which every legitimate
# archival Job carries. Labels + name pattern together mean a
# compromised SA must spoof BOTH factors to pivot off the storage
# egress. `metadata.name` is safe to read unguarded here: it is a
# required field on Job CREATE/UPDATE admission, and on DELETE the
# clause is reached only via `oldObject` (existing object — always
# named); a `generateName` spawn sees an empty name at admission and
# fails `startsWith` — fail-closed, which is the correct stance.
#
# Requires: Kubernetes 1.30+ (ValidatingAdmissionPolicy v1 GA).
#
# Issue #565 — the CEL expression below short-circuits on the
# requesting principal: `request.userInfo.username != '<prune SA>'
# || ...` means actors OTHER than the prune SA are NOT restricted by
# this policy — humans via kubectl and controllers keep their normal
# Job create/update/delete access in the namespace (the same
# carve-out shape the pod-delete VAP in
# deploy/pod-delete-admission-policy.yaml uses for the operator SA).
# Pre-#565 the expression applied to EVERY principal, contradicting
# the "humans via kubectl are left unrestricted" contract in
# AGENTS.md. Also per #565: the validation `message` must be a
# single line (folded `>-`, strip-chomped) — the API server rejects
# any message containing "\n" — and the Binding below carries the
# required `validationActions` and scopes via `matchResources`
# (the v1 Binding schema has no `selector` field).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openstudio-prune-job-scope
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: archival-admission
  annotations:
    energy.nrel.gov/description: |
      Issues #294 + #398 — constrain the prune SA's batch/jobs verbs
      to archival Jobs only: both archival labels AND the
      `oscm-archive-*` deterministic-name prefix from archival.py.
      Combined with the Role above, the prune SA can only
      create/delete Jobs that look exactly like the ones retention
      spawns, so a compromised prune pod cannot spawn arbitrary Jobs
      (labels alone are spoofable; the name pattern is the second
      factor). Since #565 only the prune SA is constrained — other
      principals are unrestricted.
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openstudio-server
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs"]
  validations:
    - expression: |
        request.userInfo.username !=
        'system:serviceaccount:openstudio-server:openstudio-storage-pruner-sa'
        ||
        (has(object.metadata.labels) &&
         object.metadata.labels["app.kubernetes.io/managed-by"] == "openstudio-operator" &&
         object.metadata.labels["app.kubernetes.io/component"] == "archival" &&
         object.metadata.name.startsWith("oscm-archive-")) ||
        (has(oldObject.metadata.labels) &&
         oldObject.metadata.labels["app.kubernetes.io/managed-by"] == "openstudio-operator" &&
         oldObject.metadata.labels["app.kubernetes.io/component"] == "archival" &&
         oldObject.metadata.name.startsWith("oscm-archive-"))
      message: >-
        openstudio-storage-pruner-sa may only create/update/delete
        Jobs named with the `oscm-archive-` prefix (the
        deterministic-name convention of archival.py::archival_job_name)
        AND labelled with BOTH app.kubernetes.io/managed-by=openstudio-operator
        AND app.kubernetes.io/component=archival (issues #294, #398, #565):
        labels alone are spoofable, so the name pattern is the second
        factor. Every other principal (humans via kubectl, controllers)
        is unrestricted by this policy.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openstudio-prune-job-scope
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: archival-admission
spec:
  policyName: openstudio-prune-job-scope
  # Issue #565: the v1 ValidatingAdmissionPolicyBinding schema has NO
  # `selector` field (the pre-fix `selector: {}` was a strict-decoding
  # unknown-field reject that made the whole manifest un-applyable) and
  # REQUIRES `validationActions`. `Deny` is the only action that
  # actually blocks the request. `matchResources` mirrors the policy's
  # own namespaceSelector gate (additive — both must match), the same
  # shape the pod-delete binding uses.
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openstudio-server
