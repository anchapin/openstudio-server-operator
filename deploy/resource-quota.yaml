# Issue #400 — ResourceQuota + LimitRange for the openstudio-server
# namespace (resource-surface blast-radius bound).
#
# ---- 2026-08-24 fleet evidence (issue #740) ----
#
# During a 600→9000 worker scale-up the ramp stalled at ~2800 total pods
# with quota-rejection symptoms. The binding dimension was the `pods` quota
# (20), not requests.memory (8Gi) or limits.memory (20Gi) — the
# per-pod memory footprint was ~7Mi (container overhead + lightweight worker
# process, not the LimitRange default 512Mi), so limits.memory (~19.6Gi
# used at 2800 pods vs 20Gi ceiling) approached but did not exceed the
# ceiling before the pods wall hit.
#
# Fleet sizing re-derivation (KEDA burst headroom math preserved; workers
# assumed to use LimitRange-injected defaults unless they declare their
# own):
#
#   Steady-state (7 pods): requests 3.5 CPU / 3.5Gi, limits 7 CPU / 7Gi
#
#   300-worker fleet (307 pods total):
#     requests: 4 chart pods 1.1 CPU + 300 workers 150m + op+prune 150m
#             ≈ 1.4 CPU / 2.1Gi   ← requests.memory: 8Gi still covers (26%)
#     limits:   4 chart pods (LimitRange 2 CPU ea) 8 CPU + 300×2 CPU
#              + op+prune (LimitRange 2 CPU ea) 4 CPU = 612 CPU /
#              4×4Gi + 300×4Gi + 2×4Gi ≈ 1.2Ti  ← limits per pod dominate
#     pods: 307  →  pods: 500 recommended
#
#   3000-worker fleet (3007 pods total):
#     requests: 4.45 CPU / 21.1Gi  ← requests.memory: 8Gi INSUFFICIENT
#                                       (needs ≈24Gi); bump to 32Gi.
#     limits:   same per-pod pattern → 6012 CPU / 12Ti  ← limits.cpu
#               quota (20) is not the target; workers need explicit limits.
#     pods: 3007  →  pods: 3500 recommended
#
#   9000-worker fleet (9007 pods total):
#     pods: 9007  →  pods: 10000 recommended
#     requests.memory: ≈63Gi  ← needs 64–72Gi
#
#   Recommended targets for occupied clusters (pre-apply checklist below):
#     pods: 10000   (covers 9000 workers + infra + headroom)
#     requests.cpu: 4   (unchanged — steady-state + KEDA burst envelope)
#     requests.memory: 32Gi  (raised from 8Gi; supports ~3000 workers at
#                              realistic 10Mi/worker footprint; see above)
#     limits.cpu: 20  (unchanged — covers chart pods at LimitRange default)
#     limits.memory: 64Gi  (raised from 20Gi; 2× requests.memory for burst
#                           headroom ratio, supports ~3000 workers at 20Gi)
#
#   NOTE: if workers declare their own explicit limits (not relying on
#   LimitRange default 2 CPU), the limits.cpu: 20 ceiling supports up to
#   80 workers at 250m each. Workers that omit limits.cpu are injected
#   the 2 CPU default which counts against the aggregate quota — ensure
#   worker specs include explicit limits.cpu or raise the quota further.
#
# ---- Pre-apply checklist (issue #740) ----
#
#   BEFORE applying to an occupied cluster:
#     kubectl describe resourcequota openstudio-server-quota -n openstudio-server
#     # Compare live usage vs proposed new values.
#     # If live pods/requests.memory/limits.memory already exceeds the
#     # new quota, either raise the quota to cover live usage first, or
#     # accept that a quota shrink would strand the existing fleet.
#     kubectl top pods -n openstudio-server  # (metrics-server required)
#     # Verify per-pod memory is within expected range before applying.
#
# ---- Original issue #400 rationale ----
#
# Pre-fix the namespace carried no ResourceQuota and no LimitRange:
# the verb surface was gated (RBAC #78/#228, admission #293/#294,
# network #112/#166) but the RESOURCE surface was not. A misbehaving
# web pod or an attacker-controlled archival Job (any image passing
# the `oscm-archive-*` admission rule) could claim arbitrary
# CPU/memory without bound, evicting the operator pod on a
# memory-constrained node and triggering D05/D12 retry storms.
#
# The two objects bound the surface at different levels:
#
#   * ResourceQuota caps the AGGREGATE. This is the actual
#     blast-radius bound: nothing in the namespace can reserve more
#     than these totals, so the operator's 100m/128Mi reservation
#     always has documented headroom. Sizing (#580, extending #400):
#
#       - requests.cpu=4 / requests.memory=8Gi COVER the KEDA burst
#         envelope unchanged. The envelope is computed at REAL
#         requests (not the LimitRange defaults — every chart pod
#         declares requests): db 250m/512Mi + queue 100m/128Mi +
#         web 500m/2Gi + web-background 250m/1Gi + maxReplicaCount=5
#         workers x 250m/512Mi + operator 100m/128Mi + prune pod
#         50m/128Mi = 2.5 CPU / 6.375Gi. #580's "11 x 500m = 5.5
#         CPU" premise assumed default-riding pods; the real-request
#         arithmetic leaves 1.5 CPU / 1.625Gi of headroom.
#       - limits.cpu=20 / limits.memory=20Gi (raised from 8/16Gi).
#         The chart's pods declare limits.memory but NOT limits.cpu,
#         so admission injects the LimitRange default limit (2 CPU /
#         4Gi ceiling) per container — and those injected limits
#         COUNT against the quota. At maxReplicaCount the aggregate
#         is 18.75 CPU / 19Gi; the pre-#580 8/16Gi sat BELOW even
#         the steady-state aggregate (10.75 CPU), so any rescheduled
#         chart pod — or the single-replica, Recreate-strategy
#         operator itself — would be quota-rejected until something
#         else terminated. 20/20Gi covers the burst envelope with
#         ~1.25 CPU / 1Gi headroom; the per-container ceiling stays
#         bounded by the LimitRange below.
#
#     Both fences are CI-level, computed from the manifests at test
#     time (tests/test_deploy_manifests.py::
#     test_resource_quota_totals_leave_room_for_steady_state and
#     test_resource_quota_covers_keda_burst_envelope — maxReplicaCount
#     parsed from deploy/keda-scaledobject.yaml, per-pod requests and
#     limits parsed from scripts/manifests/ + deploy/), so drift in
#     either direction (burst up, quota down, chart requests up)
#     fails the build.
#   * LimitRange supplies the PER-CONTAINER defaults — containers
#     that omit resources are defaulted to requests 500m/512Mi and
#     limits 2 CPU/4Gi. The defaults are load-bearing, not cosmetic:
#     a ResourceQuota that tracks limits REJECTS pods whose
#     containers omit limits, and the helm chart's pods (web,
#     web-background, worker) declare limits.memory but NOT
#     limits.cpu — without the LimitRange default the quota would
#     make those pods inadmissible. The injected 2 CPU default limit
#     is also why the aggregate limits quota must be 20 CPU: see the
#     sizing comment above (#580).
#
# Deliberately NO LimitRange `max`: the chart's pods legitimately
# declare limits.memory up to the 4Gi ceiling the issue documents,
# and the issue's scope guard forbids touching the chart's upstream
# values — a `max` at that ceiling would reject any future chart
# bump. The aggregate ResourceQuota stays the only hard per-namespace
# bound; the per-pod default is fenced at CI level instead
# (tests/test_deploy_manifests.py::
# test_no_deploy_container_exceeds_limit_range_defaults fails any
# deploy/ manifest whose container requests/limits exceed the
# defaults below).
#
# Scope guard (#400): the operator's own requests were folded from the
# 2026-08-24 live emergency patch into deploy/operator-deployment.yaml
# (requests.cpu: 250m, memory: 512Mi — CAMPAIGN-RECORD-20260824.md); the
# helm chart's upstream values are untouched. Both objects
# are namespaced core/v1 and need no extra RBAC; a cluster admin can
# apply this file alongside scripts/manifests/00-namespace.yaml.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: openstudio-server-quota
  namespace: openstudio-server
spec:
  hard:
    # Sizing rationale (#580, extending #400): the burst envelope at
    # REAL requests is ~2.75 CPU / ~6.76Gi (4 chart pods + 5 workers at
    # maxReplicaCount + operator + prune pod, every one declaring its
    # requests); the limits-side aggregate — with the LimitRange
    # injecting the 2 CPU default limit into the chart pods that omit
    # limits.cpu — is 18.75 CPU / 19Gi.
    # Updated values (issue #740): pods: 10000 for 9000-worker target;
    # requests.memory raised to 32Gi (supports ~3000 workers at realistic
    # 10Mi/worker footprint); limits.memory raised to 64Gi (2:1 burst
    # headroom ratio). Full arithmetic in the header comment above and
    # tests/test_deploy_manifests.py (the envelope is computed from the
    # manifests at test time, so any drift fails CI).
    pods: "10000"
    requests.cpu: "4"
    requests.memory: 32Gi
    limits.cpu: "20"
    limits.memory: 64Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: openstudio-server-limits
  namespace: openstudio-server
spec:
  limits:
    # `type: Container` is the only LimitRange type that can express
    # `default`/`defaultRequest` — the issue's "per-pod default" is
    # the per-container default the API injects at admission for
    # every container that omits resources.
    - type: Container
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 4Gi
