# Operator image is published by .github/workflows/release.yml on pushes to develop
# and pinned to its SHA256 digest there (issue #149). Editing this `image:` line
# back to a tag (e.g. `:dev`) would re-open the immutable-deploy guarantee the
# release.yml digest-pin step establishes — release.yml rewrites it on every
# develop push. This Deployment manifest is what runs the operator in production;
# the dryRun walkthrough evidence lives in docs/kind-validation.md and the
# securityContext hardening is in line with the prune CronJob's
# (deploy/storage-cronjob.yaml:114).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstudio-operator
  namespace: openstudio-server
spec:
  replicas: 1
  strategy:
    type: Recreate # single active poller; avoid two operators racing during rollout
  selector:
    matchLabels:
      app: openstudio-operator
  template:
    metadata:
      labels:
        app: openstudio-operator
    spec:
      serviceAccountName: openstudio-operator-sa
      # Issue #161 — pod-level defense-in-depth baseline. PSS `restricted`
      # validates pod-level runAsNonRoot + seccompProfile (NOT the
      # container-level fields), so an injected sidecar (Istio ambient
      # mesh) or a debug `ephemeralContainers` patch that omits its own
      # securityContext still inherits these pod-level defaults. fsGroup
      # 1000 makes the emptyDir /tmp mount writable by the non-root UID
      # the container runs as. Mirrors deploy/storage-cronjob.yaml:97-109
      # and archival.py's pod-level block.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: operator
          # Issue #149 — pinned by SHA256 digest, not a mutable tag. re-pinned
          # automatically by release.yml on every develop push; the `.bak`
          # rewrite keeps the install idempotent and the kubectl pull
          # unambiguous. Last re-pinned against digest sha256:6681d2545970
          # ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e on the
          # pre-issue-149 baseline; subsequent develop pushes will overwrite
          # this line via the workflow's sed.
          image: ghcr.io/anchapin/openstudio-server-operator@sha256:6681d2545970ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e
          args:
            - kopf
            - run
            - --module
            - openstudio_operator.handlers
            - --namespace
            - openstudio-server
          # Server URL comes from the CR spec.serverUrl (config.py) — single
          # config path; no OPENSTUDIO_SERVER_URL env fallback.
          env:
            - name: POD_NAMESPACE # singleton guard startup check (issue #14):
              # the only path that notices a zero-CR namespace at operator boot
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090 # conventional Prometheus port; keep in sync with
            # metrics.DEFAULT_METRICS_PORT (issue #17)
          # Issue #115 — operator hardening matching deploy/storage-cronjob.yaml:114-118.
          # readOnlyRootFilesystem requires writable /tmp for kopf / log buffering —
          # the emptyDir volume below provides it.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
