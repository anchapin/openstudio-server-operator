# Operator image is published by .github/workflows/release.yml on pushes to develop
# and pinned to its SHA256 digest there (issue #149). Editing this `image:` line
# back to a tag (e.g. `:dev`) would re-open the immutable-deploy guarantee the
# release.yml digest-pin step establishes — release.yml rewrites it on every
# develop push. This Deployment manifest is what runs the operator in production;
# the dryRun walkthrough evidence lives in docs/kind-validation.md and the
# securityContext hardening is in line with the prune CronJob's
# (deploy/storage-cronjob.yaml:114).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstudio-operator
  namespace: openstudio-server
spec:
  replicas: 1
  strategy:
    type: Recreate # single active poller; avoid two operators racing during rollout
  selector:
    matchLabels:
      app: openstudio-operator
  template:
    metadata:
      labels:
        # Issue #224 — the operator pod MUST carry every label the
        # NetworkPolicies in deploy/network-policy.yaml match on. The
        # deny-egress (#112) and metrics-ingress (#166) policies both
        # require the conjunction `app: openstudio-operator` AND
        # `app.kubernetes.io/managed-by: openstudio-operator`; the
        # allow-egress policy requires only `app: openstudio-operator`.
        # Without the second label the deny never selects the operator
        # pod (it can egress anywhere on any port, contradicting
        # network-policy.yaml:8) and the metrics endpoint on :9090 is
        # readable by every pod in every namespace on clusters without
        # a default-deny-ingress CNI plugin.
        app: openstudio-operator
        app.kubernetes.io/managed-by: openstudio-operator
    spec:
      serviceAccountName: openstudio-operator-sa
      # Issue #414 — node-pressure protection: single-replica + Recreate
      # means a mid-tick eviction leaves the StatusStore RMW half-applied.
      # The openstudio-operator-critical PriorityClass
      # (deploy/priority-class.yaml, value 1000000000,
      # preemptionPolicy: Never) makes this pod the LAST evicted under
      # node pressure. Archival Jobs do NOT carry this class — they stay
      # evictable first.
      priorityClassName: openstudio-operator-critical
      # Issue #161 — pod-level defense-in-depth baseline. PSS `restricted`
      # validates pod-level runAsNonRoot + seccompProfile (NOT the
      # container-level fields), so an injected sidecar (Istio ambient
      # mesh) or a debug `ephemeralContainers` patch that omits its own
      # securityContext still inherits these pod-level defaults. fsGroup
      # 1000 makes the emptyDir /tmp mount writable by the non-root UID
      # the container runs as. Mirrors deploy/storage-cronjob.yaml:97-109
      # and archival.py's pod-level block.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: operator
          # Issue #149 — pinned by SHA256 digest, not a mutable tag. re-pinned
          # automatically by release.yml on every develop push; the `.bak`
          # rewrite keeps the install idempotent and the kubectl pull
          # unambiguous. Last re-pinned against digest sha256:6681d2545970
          # ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e on the
          # pre-issue-149 baseline; subsequent develop pushes will overwrite
          # this line via the workflow's sed.
          image: ghcr.io/anchapin/openstudio-server-operator@sha256:6681d2545970ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e
          # Issue #681 — programmatic entrypoint, NOT the `kopf run` CLI.
          # The CLI cannot carry OperatorSettings; without them kopf's
          # bookkeeping PATCHes the READ-ONLY main OSCM resource (diffbase
          # into metadata.annotations, the KopfFinalizerMarker into
          # metadata.finalizers) and 403s on every processing cycle under
          # the deliberate #228 RBAC (patch only on /status).
          # `openstudio_operator.__main__` builds the #681 settings
          # (StatusDiffBaseStorage + finalizer=None + timer finalizer
          # disarm) and calls kopf.run(...) — kopf's documented embedding
          # pattern. The namespace flag mirrors the old CLI invocation's
          # explicit `--namespace` (the entrypoint default is identical).
          args:
            - python
            - -m
            - openstudio_operator
            - --namespace
            - openstudio-server
          # Server URL comes from the CR spec.serverUrl (config.py) — single
          # config path; no OPENSTUDIO_SERVER_URL env fallback.
          env:
            - name: POD_NAMESPACE # singleton guard startup check (issue #14):
              # the only path that notices a zero-CR namespace at operator boot
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Issue #678 — kopf's peering identity detection
            # (`kopf/_core/engines/peering.py::detect_own_id`) calls
            # `getpass.getuser()`; CPython consults LOGNAME/USER/LNAME/
            # USERNAME env vars first and only falls through to
            # `pwd.getpwuid(os.getuid())` when none are set. A bare
            # container sets none of them, and the image runs UID 1000
            # (Dockerfile `USER 1000`, #589) with no /etc/passwd entry
            # for that UID — the lookup raises KeyError and the operator
            # crash-loops before any handler runs. Pinning USER short-
            # circuits the env-var branch without touching the image or
            # the #161 securityContext posture. Not reproduced by the
            # kind-validation walkthrough because that evidence ran
            # `kopf run` from a dev shell (docs/kind-validation.md
            # "Run the operator locally (no image needed)"), which
            # inherits USER/LOGNAME from the login environment — only
            # the passwd-less in-cluster pod hits the pwd fallback.
            - name: USER
              value: operator
            # Issue #242 — optional hook for clusters whose API server /
            # inter-service traffic is fronted by a custom CA. When unset
            # or empty the client uses the system trust store
            # (``verify=True`` is pinned explicitly regardless). Default
            # empty (regression fence — see Working rules in AGENTS.md):
            # operators MUST opt in per-cluster rather than inherit a
            # baked-in bundle path that would mask a misconfigured
            # in-cluster CA.
            # Issue #396 — the enablement recipe for corporate-PKI
            # clusters (full runbook: docs/validation.md §Prerequisites):
            #   1. kubectl -n openstudio-server create secret generic \
            #        openstudio-tls-ca-bundle --from-file=ca-bundle.crt
            #   2. uncomment the tls-ca-bundle volumeMount + volume below,
            #   3. set this value to the in-pod path
            #      /etc/openstudio/tls/ca-bundle.crt.
            # openstudio_client._resolve_tls_ca_bundle (#296) then checks
            # the path exists and carries a BEGIN CERTIFICATE PEM marker;
            # a set-but-broken value aborts every tick with
            # OperatorConfigError rather than degrading to an SSLError.
            - name: OPENSTUDIO_TLS_CA_BUNDLE
              value: ""
            # Issue #401 — optional bearer-token authN for /metrics. Default
            # empty = open plaintext gated only by the metrics-ingress
            # NetworkPolicy (#166) — the documented default; do NOT make the
            # token mandatory. To enable per-cluster:
            #   1. kubectl -n openstudio-server create secret generic \
            #        openstudio-operator-metrics-token --from-literal=token=<secret>
            #   2. uncomment the metrics-token volumeMount + volume below,
            #   3. set this value to /var/run/openstudio-metrics/token,
            #   4. point BOTH httpGet probes at /healthz (see the probe note
            #      below) — the kubelet cannot present a Bearer token, so
            #      401s on /metrics would restart-loop the pod.
            # The server re-reads the token file on every request, so Secret
            # rotation takes effect without an operator restart; a missing or
            # empty file fails CLOSED (every /metrics request 401s).
            - name: OPENSTUDIO_METRICS_TOKEN_FILE
              value: ""
          ports:
            - name: metrics
              containerPort: 9090 # conventional Prometheus port; keep in sync with
            # metrics.DEFAULT_METRICS_PORT (issue #17)
          # Issue #391 — kubelet restart path for a wedged operator. The
          # four @kopf.timer handlers can silently stop firing (deadlock,
          # indefinitely-blocking REST call, GC pause, stuck list_crs) while
          # the pod stays `Running`; single-replica + Recreate means the
          # kubelet is the ONLY restart path. Both probes hit the metrics
          # endpoint (already exposed on the named port `metrics` above):
          # liveness restarts a pod whose metrics endpoint has gone
          # unresponsive for failureThreshold * periodSeconds (~90s);
          # readiness removes the pod from Service endpoints during boot.
          # The new pod resumes from the persisted CR .status (D04).
          #
          # Issue #401 — when the /metrics bearer token is enabled, change
          # BOTH probe paths from /metrics to /healthz: the kubelet cannot
          # present an Authorization header, and a 401 on /metrics counts
          # as probe failure (restart loop). /healthz serves a bare 200
          # with no exposition data, so it leaks nothing.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics # named port → containerPort 9090 (issue #17)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Issue #115 — operator hardening matching deploy/storage-cronjob.yaml:114-118.
          # readOnlyRootFilesystem requires writable /tmp for kopf / log buffering —
          # the emptyDir volume below provides it.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Issue #401 — uncomment together with the metrics-token volume
            # below AND the OPENSTUDIO_METRICS_TOKEN_FILE env value above to
            # enable bearer-token authN on /metrics:
            # - name: metrics-token
            #   mountPath: /var/run/openstudio-metrics
            #   readOnly: true
            # Issue #396 — uncomment together with the tls-ca-bundle volume
            # below AND the OPENSTUDIO_TLS_CA_BUNDLE env value above to
            # trust a corporate-PKI CA bundle for the upstream
            # spec.serverUrl REST traffic (NOT the operator's own
            # kube-apiserver connection). Mirrors the commented #401
            # metrics-token pair: the default Deployment ships WITHOUT this
            # mount so it schedules on clusters where the Secret does not
            # exist; a live secretName reference to a missing Secret would
            # block pod scheduling (FailedMount).
            # - name: tls-ca-bundle
            #   mountPath: /etc/openstudio/tls
            #   readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Issue #401 — uncomment together with the metrics-token volumeMount
        # above AND the OPENSTUDIO_METRICS_TOKEN_FILE env value above:
        # - name: metrics-token
        #   secret:
        #     secretName: openstudio-operator-metrics-token
        #     items:
        #       - key: token
        #         path: token
        # Issue #396 — uncomment together with the tls-ca-bundle volumeMount
        # above AND the OPENSTUDIO_TLS_CA_BUNDLE env value above. The
        # key→path mapping puts the PEM at /etc/openstudio/tls/ca-bundle.crt
        # — the in-pod path the env comment above tells the admin to set.
        # - name: tls-ca-bundle
        #   secret:
        #     secretName: openstudio-tls-ca-bundle
        #     items:
        #       - key: ca-bundle.crt
        #         path: ca-bundle.crt
