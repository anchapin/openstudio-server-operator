# Operator image is published by .github/workflows/release.yml on pushes to develop.
# TODO(phase 1): verify against a real cluster once handler logic lands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstudio-operator
  namespace: openstudio-server
spec:
  replicas: 1
  strategy:
    type: Recreate # single active poller; avoid two operators racing during rollout
  selector:
    matchLabels:
      app: openstudio-operator
  template:
    metadata:
      labels:
        app: openstudio-operator
    spec:
      serviceAccountName: openstudio-operator-sa
      containers:
        - name: operator
          image: ghcr.io/anchapin/openstudio-server-operator:dev
          args:
            - kopf
            - run
            - --module
            - openstudio_operator.handlers
            - --namespace
            - openstudio-server
          # Server URL comes from the CR spec.serverUrl (config.py) — single
          # config path; no OPENSTUDIO_SERVER_URL env fallback.
          env:
            - name: POD_NAMESPACE # singleton guard startup check (issue #14):
              # the only path that notices a zero-CR namespace at operator boot
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090 # conventional Prometheus port; keep in sync with
              # metrics.DEFAULT_METRICS_PORT (issue #17)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
