# Operator image is published by .github/workflows/release.yml on pushes to develop
# and pinned to its SHA256 digest there (issue #149). Editing this `image:` line
# back to a tag (e.g. `:dev`) would re-open the immutable-deploy guarantee the
# release.yml digest-pin step establishes — release.yml rewrites it on every
# develop push. This Deployment manifest is what runs the operator in production;
# the dryRun walkthrough evidence lives in docs/kind-validation.md and the
# securityContext hardening is in line with the prune CronJob's
# (deploy/storage-cronjob.yaml:114).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstudio-operator
  namespace: openstudio-server
spec:
  replicas: 1
  strategy:
    type: Recreate # single active poller; avoid two operators racing during rollout
  selector:
    matchLabels:
      app: openstudio-operator
  template:
    metadata:
      labels:
        # Issue #224 — the operator pod MUST carry every label the
        # NetworkPolicies in deploy/network-policy.yaml match on. The
        # deny-egress (#112) and metrics-ingress (#166) policies both
        # require the conjunction `app: openstudio-operator` AND
        # `app.kubernetes.io/managed-by: openstudio-operator`; the
        # allow-egress policy requires only `app: openstudio-operator`.
        # Without the second label the deny never selects the operator
        # pod (it can egress anywhere on any port, contradicting
        # network-policy.yaml:8) and the metrics endpoint on :9090 is
        # readable by every pod in every namespace on clusters without
        # a default-deny-ingress CNI plugin.
        app: openstudio-operator
        app.kubernetes.io/managed-by: openstudio-operator
    spec:
      serviceAccountName: openstudio-operator-sa
      # Issue #161 — pod-level defense-in-depth baseline. PSS `restricted`
      # validates pod-level runAsNonRoot + seccompProfile (NOT the
      # container-level fields), so an injected sidecar (Istio ambient
      # mesh) or a debug `ephemeralContainers` patch that omits its own
      # securityContext still inherits these pod-level defaults. fsGroup
      # 1000 makes the emptyDir /tmp mount writable by the non-root UID
      # the container runs as. Mirrors deploy/storage-cronjob.yaml:97-109
      # and archival.py's pod-level block.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: operator
          # Issue #149 — pinned by SHA256 digest, not a mutable tag. re-pinned
          # automatically by release.yml on every develop push; the `.bak`
          # rewrite keeps the install idempotent and the kubectl pull
          # unambiguous. Last re-pinned against digest sha256:6681d2545970
          # ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e on the
          # pre-issue-149 baseline; subsequent develop pushes will overwrite
          # this line via the workflow's sed.
          image: ghcr.io/anchapin/openstudio-server-operator@sha256:6681d2545970ff5183cf4a99c2310a8a1a6febaf8d9be43af9ed1bab46f0ee4e
          args:
            - kopf
            - run
            - --module
            - openstudio_operator.handlers
            - --namespace
            - openstudio-server
          # Server URL comes from the CR spec.serverUrl (config.py) — single
          # config path; no OPENSTUDIO_SERVER_URL env fallback.
          env:
            - name: POD_NAMESPACE # singleton guard startup check (issue #14):
              # the only path that notices a zero-CR namespace at operator boot
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Issue #242 — optional hook for clusters whose API server /
            # inter-service traffic is fronted by a custom CA. Mount the CA
            # bundle as a Secret volume and set this env var to its
            # in-container path; when unset the client uses the system
            # trust store (``verify=True`` is pinned explicitly regardless).
            # Default empty (regression fence — see Working rules in AGENTS.md):
            # operators MUST opt in per-cluster rather than inherit a baked-in
            # bundle path that would mask a misconfigured in-cluster CA.
            - name: OPENSTUDIO_TLS_CA_BUNDLE
              value: ""
          ports:
            - name: metrics
              containerPort: 9090 # conventional Prometheus port; keep in sync with
            # metrics.DEFAULT_METRICS_PORT (issue #17)
          # Issue #391 — kubelet restart path for a wedged operator. The
          # four @kopf.timer handlers can silently stop firing (deadlock,
          # indefinitely-blocking REST call, GC pause, stuck list_crs) while
          # the pod stays `Running`; single-replica + Recreate means the
          # kubelet is the ONLY restart path. Both probes hit the metrics
          # endpoint (already exposed on the named port `metrics` above):
          # liveness restarts a pod whose metrics endpoint has gone
          # unresponsive for failureThreshold * periodSeconds (~90s);
          # readiness removes the pod from Service endpoints during boot.
          # The new pod resumes from the persisted CR .status (D04).
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics # named port → containerPort 9090 (issue #17)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Issue #115 — operator hardening matching deploy/storage-cronjob.yaml:114-118.
          # readOnlyRootFilesystem requires writable /tmp for kopf / log buffering —
          # the emptyDir volume below provides it.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
