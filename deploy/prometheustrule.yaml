# PrometheusRule alert definitions for the openstudio-server-operator /metrics
# surface (issue #468).
#
# The alert expressions below are the machine-readable transcription of the
# canonical "Alert on ..." docstrings in src/openstudio_operator/metrics.py and
# the README.md metrics table — every family referenced here is asserted to
# exist in tests/_metrics_inventory.py by tests/test_monitoring_artifacts.py,
# so a metrics-family rename fails CI instead of silently breaking the alert.
#
# APPLY + PICKUP
# --------------
# This manifest is applied by the CLUSTER ADMIN (kubectl apply -f deploy/),
# NOT by the operator: the operator's namespaced Role
# (deploy/rbac.yaml) intentionally holds no `prometheusrules` verbs, and the
# operator never creates or mutates PrometheusRule objects. The resource is
# namespaced (monitoring.coreos.com/v1) and lives in `openstudio-server` so a
# Prometheus instance that selects rules per-namespace picks it up alongside
# the scrape target.
#
# Rule-selector label: kube-prometheus-stack's default Prometheus
# `ruleSelector` matches `release: <helm-release-name>`; the stock release
# name is `prometheus`, so that label is shipped below for default pickup.
# If your Prometheus was installed under a different release name (e.g.
# `kube-prometheus-stack` or `monitoring`), change the label to match your
# `ruleSelector.matchLabels`, or add this manifest's labels to the selector.
# Clusters not running the Prometheus Operator can transcribe the `expr`
# strings into static rule files — they are plain PromQL.
#
# SCRAPE PREREQUISITE
# -------------------
# The expressions assume a Prometheus scrape config for the operator Pod's
# plaintext :9090/metrics endpoint (see README.md#metrics; the ingress is
# gated by the `openstudio-operator-metrics-ingress` NetworkPolicy, issue
# #166 — the scraper must run in the `prometheus` namespace or carry
# `app.kubernetes.io/component: metrics-scraper`). The storage-prune
# CronJob exposes the same families on its own pod; the prune group below
# alerts on kube-state-metrics Job status (the durable signal — see the
# group comment).
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openstudio-operator-alerts
  namespace: openstudio-server
  labels:
    app.kubernetes.io/name: openstudio-operator
    app.kubernetes.io/part-of: openstudio-server
    # kube-prometheus-stack default ruleSelector match (see header). Rename
    # to your release if it is not `prometheus`.
    release: prometheus
spec:
  groups:
    # ---------------------------------------------------------------------
    # Handler health — the four OSCM timer wrappers (analysis_sla,
    # datapoint_watchdog, worker_recycler, web_background_monitor) plus the
    # REST client, the event path, and the status store they share.
    # ---------------------------------------------------------------------
    - name: openstudio-operator.handlers
      rules:
        # metrics.py HANDLER_TICK_FAILURES_TOTAL (#117) — sustained nonzero
        # rate per (module, error_type) tells the on-call which downstream
        # (REST, Redis, k8s API) is degraded.
        - alert: OpenStudioOperatorHandlerTickFailures
          expr: rate(openstudio_operator_handler_tick_failures_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Operator handler ticks are failing ({{ $labels.module }} / {{ $labels.error_type }})
            description: >-
              Sustained nonzero rate of openstudio_operator_handler_tick_failures_total
              for module {{ $labels.module }} with error type {{ $labels.error_type }}
              — the timer wrapper is silently skipping ticks (D12 retry-on-next-poll).
              Check which downstream is degraded: REST (OpenStudioApiError), Redis
              (RedisClientError), or the k8s API (ApiException / StatusStoreError).
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py REST_REQUEST_DURATION_SECONDS (#308) — the histogram's
        # _count series labelled outcome="exception" is the canonical
        # REST-degraded signal (4xx immediately, 5xx retries exhausted,
        # non-GET 5xx per #226).
        - alert: OpenStudioOperatorRestExceptionRate
          expr: rate(openstudio_operator_rest_request_duration_seconds_count{outcome="exception"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenStudio REST calls are raising ({{ $labels.method }})
            description: >-
              Sustained nonzero rate on
              openstudio_operator_rest_request_duration_seconds_count{outcome="exception"}
              for method {{ $labels.method }} — the 3x retry envelope is exhausted or the
              call failed before retry. Cross-check the operator pod's JSON logs for the
              OpenStudioApiError detail and the web Service health.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py EVENTS_EMIT_FAILURES_TOTAL (#255) — the operator cannot
        # post Kubernetes Events; distinct from handler_tick_failures.
        - alert: OpenStudioOperatorEventEmitFailures
          expr: rate(openstudio_operator_events_emit_failures_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Operator cannot post Kubernetes Events ({{ $labels.reason }})
            description: >-
              Sustained nonzero rate of openstudio_operator_events_emit_failures_total
              — kopf.event posting is failing (apiserver unreachable or rejecting).
              Distinct from handler_tick_failures_total: actions may still be firing
              while their Events are lost.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py STATUS_CONFLICT_RETRIES_EXHAUSTED_TOTAL (#119) — a CR
        # status write was lost when the 409 retry budget ran out.
        - alert: OpenStudioOperatorStatusConflictRetriesExhausted
          expr: rate(openstudio_operator_status_conflict_retries_exhausted_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Status-store RMW retry budget exhausted ({{ $labels.namespace }}/{{ $labels.name }})
            description: >-
              Sustained nonzero rate of
              openstudio_operator_status_conflict_retries_exhausted_total — status-store
              read-modify-write cycles are losing the 409 race faster than the retry
              budget absorbs. Cross-check status_conflicts_total and the singleton guard:
              multiple writers on one CR is the usual cause (D05).
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py STATUS_MAP_ENTRIES (#489) — the LEAD-TIME companion to
        # the #171 cap counter: status_map_caps_total and the
        # StatusMapCapped Warning Event fire only AFTER a map has hit
        # STATUS_MAP_MAX_ENTRIES (10000) and the oldest D04 idempotency
        # anchors are already being dropped (an evicted softStops /
        # startedSince anchor for a still-relevant analysis silently
        # re-arms the double-soft-stop / double-requeue paths the anchors
        # exist to prevent). Threshold 8000 = 0.8 x the cap; at typical
        # fill rates the 2000-entry headroom is days of runway to prune
        # or revisit the cap — archivedAnalyses' monotonic growth on a
        # long-lived cluster is the canonical case.
        - alert: OpenStudioOperatorStatusMapNearCap
          expr: openstudio_operator_status_map_entries > 8000
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: CR .status map nearing the 10k eviction cap ({{ $labels.namespace }}/{{ $labels.name }} {{ $labels.map_name }})
            description: >-
              openstudio_operator_status_map_entries > 8000 (0.8 x
              STATUS_MAP_MAX_ENTRIES) sustained for 30m on CR
              {{ $labels.namespace }}/{{ $labels.name }}, map {{ $labels.map_name }} —
              at the current fill rate the #171 defensive cap will start evicting the
              OLDEST entries, and those entries are the D04 idempotency anchors (an
              evicted softStops / startedSince anchor for a still-relevant analysis
              silently re-arms the double-soft-stop / double-requeue paths the anchors
              exist to prevent). The post-hoc signals (status_map_caps_total +
              StatusMapCapped Warning Event) fire only once anchors are already lost.
              Act inside the runway: prune completed analyses (the retention
              pipeline's archivedAnalyses entries are the usual monotonic growth),
              or revisit the cap sizing — do not wait for duplicate-action anomalies.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py HANDLER_LAST_TICK_TIMESTAMP (#469) — the scheduler
        # heartbeat: the ONLY signal that advances when the scheduler is
        # merely invoking the timers. Every other family here is
        # event-driven and reads green while ticks are silently
        # unscheduled (kopf internals shift so install_singleton_guard
        # returns 0 and the timers are unwrapped, the CR is deleted, the
        # scheduling loop wedges). Thresholds are 3x each module's
        # interval (per-module cadences in _constants.py: analysis_sla
        # 30s, datapoint_watchdog 60s, worker_recycler 300s,
        # web_background_monitor 60s).
        - alert: OpenStudioOperatorHandlerHeartbeatStale
          expr: time() - openstudio_operator_handler_last_tick_timestamp{module="analysis_sla"} > 90
            or time() - openstudio_operator_handler_last_tick_timestamp{module="datapoint_watchdog"} > 180
            or time() - openstudio_operator_handler_last_tick_timestamp{module="worker_recycler"} > 900
            or time() - openstudio_operator_handler_last_tick_timestamp{module="web_background_monitor"} > 180
          labels:
            severity: critical
          annotations:
            summary: Handler scheduler heartbeat is stale ({{ $labels.module }})
            description: >-
              time() - openstudio_operator_handler_last_tick_timestamp > 3x the module's
              interval for module {{ $labels.module }} — the timer has not completed an
              invocation (success OR caught failure) in over three polls. The operator
              may look healthy on every event-driven series while doing nothing: check
              the pod is running, the OSCM CR still exists, and (after a kopf upgrade)
              tests/test_singleton_registry_coverage.py against the deployed kopf
              version — silently unwrapped timers are the documented kopf-pin failure
              mode this alert exists to catch.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

    # ---------------------------------------------------------------------
    # Singleton guard (D05) — one OSCM CR per namespace, oldest wins.
    # ---------------------------------------------------------------------
    - name: openstudio-operator.singleton
      rules:
        # metrics.py SINGLETON_ELECTION_TOTAL (#239) — change-gated: fires on
        # the transition into a multi-CR namespace. Also the signal that
        # catches a silently-unwrapped guard (kopf internals changed shape).
        - alert: OpenStudioOperatorSingletonConflict
          expr: rate(openstudio_operator_singleton_election_total{outcome="conflict"}[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: Singleton-guard conflict in namespace {{ $labels.namespace }}
            description: >-
              Nonzero rate on openstudio_operator_singleton_election_total{outcome="conflict"}
              — more than one OSCM CR exists in the namespace and the singleton guard
              (D05) elected the oldest. Delete the loser CRs (their SingletonConflict
              Warning Events name the winner). A conflict with no matching Warning
              Events means the guard is silently bypassed — check
              tests/test_singleton_registry_coverage.py against the deployed kopf version.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py SINGLETON_LOSER_SKIPS_TOTAL (#403) — the per-tick twin:
        # the change-gated election counter is silent for a STABLE multi-CR
        # namespace; this one fires on every suppressed loser tick.
        - alert: OpenStudioOperatorSingletonLoserSkips
          expr: rate(openstudio_operator_singleton_loser_skips_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Sustained singleton-guard loser suppressions ({{ $labels.namespace }}/{{ $labels.name }})
            description: >-
              Sustained nonzero rate of openstudio_operator_singleton_loser_skips_total
              — a stable multi-CR configuration: every tick of CR
              {{ $labels.namespace }}/{{ $labels.name }} (module {{ $labels.module }}) is
              being suppressed by the singleton guard. Delete the loser CR.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py SINGLETON_WRAPPED_HANDLERS (#491) +
        # SINGLETON_EXPECTED_HANDLERS (#570) — the RUNTIME half of the
        # kopf-pin fence: install_singleton_guard wraps the OSCM timers
        # at boot by walking kopf's private registry._spawning._handlers.
        # Zero wrapped on a booted operator that expects timers is the
        # silent-unwrap failure mode — D05 enforcement disabled while
        # every timer still fires ungated and the operator appears
        # healthy. Issue #570 rekeys the expression from == 0 to a
        # strict wrapped < expected: a PARTIAL unwrap (one timer skipped
        # for missing #250 registration, or a dataclasses.replace
        # TypeError) leaves the wrap gauge at a plausible "3 of 4" while
        # the ungated timer double-serves a loser CR — exactly the D05
        # violation the == 0 clause could not see. Strict < subsumes the
        # old clause: a total unwrap is always 0 < N for any nonzero
        # expectation (the expected gauge falls back to the Python-level
        # registry population on the internals-mismatch branch, so the
        # kopf-upgrade shape keeps firing too). The CI-time fence is
        # tests/test_singleton_registry_coverage.py; this alert is what
        # catches a deployed kopf whose internals shifted anyway.
        # Complementary to OpenStudioOperatorHandlerHeartbeatStale
        # (#469): the heartbeat proves the scheduler is invoking the
        # timers, the wrap pair proves those invocations are guarded.
        - alert: OpenStudioOperatorSingletonGuardUnwrapped
          expr: openstudio_operator_singleton_wrapped_handlers < openstudio_operator_singleton_expected_handlers
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Singleton guard left OSCM handlers ungated at boot ({{ $value }} behind expectation)
            description: >-
              openstudio_operator_singleton_wrapped_handlers <
              openstudio_operator_singleton_expected_handlers — the singleton
              gate left one or more OSCM spawning handlers running UN-GATED:
              every timer still fires, but the ones the gate could not wrap
              serve EVERY CR in the namespace (in a multi-CR namespace they
              would double-soft-stop, double-requeue, and double-restart on
              the loser CR — the exact D05 violation). A PARTIAL gap (wrapped
              = 3 of expected 4) means a handler was skipped for missing
              #250 Python-registry registration or a dataclasses.replace
              TypeError; a TOTAL gap (wrapped = 0) means a kopf upgrade moved
              or renamed the private registry._spawning._handlers layout the
              gate walks (the documented kopf-pin failure mode — the expected
              gauge then reads the Python-level registry population).
              Cross-check the #469 heartbeat
              (handler_last_tick_timestamp proves scheduling, not guarding)
              and run tests/test_singleton_registry_coverage.py against the
              deployed kopf version; pin kopf back into the >=1.37,<1.45
              band or add the missing _oscm_handlers.register() call before
              re-deploying.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

    # ---------------------------------------------------------------------
    # Observability substrate — the metrics endpoint itself, the deferred-
    # Warning-event sink, the Redis key-layout validator, and the
    # operator's config posture (#492).
    # ---------------------------------------------------------------------
    - name: openstudio-operator.substrate
      rules:
        # metrics.py METRICS_SERVER_BOUND (#393) — the canonical "Prometheus
        # scrape is down because of US" signal. Pair with blackbox-exporter
        # up==0: when the bind failed this pod's /metrics is dead, so the
        # 0.0 cannot be scraped from the pod itself on the SAME restart —
        # the gauge is the durable record for post-mortems.
        - alert: OpenStudioOperatorMetricsServerUnbound
          expr: openstudio_operator_metrics_server_bound == 0
          labels:
            severity: critical
          annotations:
            summary: /metrics server failed to bind ({{ $labels.addr }}:{{ $labels.port }})
            description: >-
              openstudio_operator_metrics_server_bound == 0 — the /metrics server's
              first bind attempt raised OSError on {{ $labels.addr }}:{{ $labels.port }}
              (port already in use or unbindable address). The operator keeps running
              with /metrics dead; only the WARNING log and this gauge record it.
              Restart the pod after freeing the port.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py WARNINGS_DEFERRED_DROPPED_TOTAL (#310) — Warning Events
        # are being silently lost past the sink's 1000-entry cap.
        - alert: OpenStudioOperatorWarningsDeferredDropped
          expr: rate(openstudio_operator_warnings_deferred_dropped_total[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: Deferred Warning Events are being dropped ({{ $labels.reason }})
            description: >-
              Nonzero rate of openstudio_operator_warnings_deferred_dropped_total — the
              QueuedKopfEventSink hit MAX_DEFERRED_WARNING_EVENTS (1000) and deferred
              Warning Events are being dropped, breaking the at-least-once deferred-event
              contract (#234). The apiserver watch stream is likely stalled; pair with
              the warnings_deferred_queue_depth gauge on the dashboard.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py REDIS_KEY_LAYOUT_STATUS (#253) — 0.0 for every terminal
        # status other than ok (degraded | unreachable | error | skipped).
        - alert: OpenStudioOperatorRedisKeyLayoutInvalid
          expr: openstudio_operator_redis_key_layout_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Redis key-layout validation is not ok
            description: >-
              openstudio_operator_redis_key_layout_status == 0 — the boot-time validator
              (#163) did not return ok. The post-#44 failure mode follows: a live
              v3.11.0 layout drift takes resque_workers_seen_max silent, the stall
              condition fires vacuously, and the operator periodic-restarts
              web_background while everything looks healthy.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py RESQUE_WORKERS_SEEN_MAX (#44/#87) — 0 with a reachable
        # Redis means no workers are registered: the fleet is gone OR the
        # centralized Resque key constants drifted from the live layout.
        - alert: OpenStudioOperatorNoResqueWorkers
          expr: openstudio_operator_resque_workers_seen_max == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: No Resque workers observed
            description: >-
              openstudio_operator_resque_workers_seen_max == 0 — the operator has never
              observed a worker in resque:workers this process lifetime (the gauge is
              emitted every poll since #87). Either the worker fleet is gone or the
              centralized Resque key constants do not match the live v3.11.0 layout —
              the stall-condition leg 2 is vacuously true and web_background restarts
              will fire while everything looks healthy.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py DRY_RUN_ACTIVE (#492) — the D11 posture gauge. The
        # 1h `for` is a MIGRATION WINDOW, not a reaction SLO: dry-run is
        # a legitimate canary-staging posture, so the alert fires only
        # when it is LEFT ON. Labelled by (namespace, name) so a
        # multi-CR namespace names the offending CR. A dry-run
        # operator on a production cluster past its window means every
        # mutating action is suppressed — analyses over SLA are not
        # being stopped, zombies are not being requeued.
        - alert: OpenStudioOperatorDryRunActive
          expr: openstudio_operator_dry_run_active == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Operator is in dry-run mode ({{ $labels.namespace }}/{{ $labels.name }})
            description: >-
              openstudio_operator_dry_run_active == 1 for over an hour on CR
              {{ $labels.namespace }}/{{ $labels.name }} — spec.dryRun is true and every
              mutating action (soft-stops, requeues, pod evictions, restarts) is
              suppressed (D11), emitted only as dry-run-marked Events. Dry-run during
              canary staging is intentional; LEFT ON past the migration window it means
              the operator is unarmed. Flip spec.dryRun to false (the DryRunToggled
              audit Event, #397, records who flipped it last per managedFields).
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

    # ---------------------------------------------------------------------
    # web_background stall window + queue-fabric freshness (#254 / #312).
    # ---------------------------------------------------------------------
    - name: openstudio-operator.stall
      rules:
        # metrics.py STALL_WINDOW_ELAPSED_SECONDS (#254) — early warning
        # between the first sustained observation and the eventual
        # web_background_restarts_total increment. The action gate itself
        # is the CRD's spec.stallWindowMinutes (policy, not hardcoded); the
        # 60s threshold here is a fixed fraction chosen to page BEFORE the
        # typical window closes — tune per cluster if stallWindowMinutes is
        # set low.
        - alert: OpenStudioOperatorStallWindowAccumulating
          expr: openstudio_operator_stall_window_elapsed_seconds > 60
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: web_background stall window is accumulating
            description: >-
              openstudio_operator_stall_window_elapsed_seconds has been above 60s for
              2m — the sustained queue-stall condition is holding and the window is
              accumulating toward the web_background restart gate
              (spec.stallWindowMinutes). Heads-up before the restart fires: check the
              Resque queue depths and web_background pod health now.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py RESQUE_QUEUE_DEPTH_FRESH (#312) — the data gauge is NOT
        # touched on the exception path; this staleness expression is the
        # only signal that the operator has LOST visibility (Redis
        # unreachable, ApiException) while the last depth reading
        # masquerades as live. 300s = 5 missed sensing ticks (cadence 60s).
        - alert: OpenStudioOperatorResqueQueueDepthStale
          expr: time() - openstudio_operator_resque_queue_depth_fresh > 300
          labels:
            severity: warning
          annotations:
            summary: Resque queue-depth reading is stale (>5 missed ticks)
            description: >-
              time() - openstudio_operator_resque_queue_depth_fresh > 300 — no
              successful queue_depths() Redis read for over five sensing ticks (cadence
              60s). The resque_queue_depth gauge is holding a stale value: the operator
              has lost visibility into the queue fabric (Redis unreachable or the read
              path raising). Do not trust the depth gauges until freshness recovers.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # metrics.py STALL_WINDOW_FRESH (#312) — the same staleness idiom for
        # the stall-window gauge: a stale nonzero value masquerades as a
        # continuing stall across a blind gap (tracker.reset() on the
        # exception path).
        - alert: OpenStudioOperatorStallWindowStale
          expr: time() - openstudio_operator_stall_window_fresh > 300
          labels:
            severity: warning
          annotations:
            summary: Stall-window reading is stale (>5 missed ticks)
            description: >-
              time() - openstudio_operator_stall_window_fresh > 300 — no successful
              run_stall_tick update for over five sensing ticks (cadence 60s). The
              stall_window_elapsed_seconds gauge may be showing a stale accumulated
              window across a blind gap (RedisClientError / ApiException path).
              Investigate the web_background monitor's downstreams before trusting (or
              acting on) the stall display.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

    # ---------------------------------------------------------------------
    # Storage-prune CronJob (#306) — separate process, same /metrics port.
    # ---------------------------------------------------------------------
    - name: openstudio-operator.prune
      rules:
        # Follow-up from #470 (landed with #469): the original alert keyed
        # on rate(openstudio_operator_prune_tick_failures_total[5m]) —
        # mathematically meaningless. The prune pod starts a metrics
        # server, runs ONE tick, and exits within seconds, so the counter
        # is per-pod-lifetime (resets to zero on every run) and a 30-60 s
        # scrape samples it zero-to-one times — the README triage guidance
        # (#470) says treat the counter as best-effort and alert on failed
        # Jobs. Rekeyed onto kube-state-metrics Job status — the durable
        # signal: the prune entrypoint exits nonzero on every failure
        # branch (3 empty spec.redisUrl #392, 4 CR-list failure, 5 D12
        # runtime failure; exit-code table in prune_entrypoint.py's module
        # docstring), so K8s marks the Job Failed and failedJobsHistoryLimit
        # (3) retains it for this alert to see. Requires kube-state-metrics
        # (standard in kube-prometheus-stack). The complementary
        # absence-of-success variant the #468 set deferred is shipped
        # below since #569 — the failed-Job alert is event-driven and
        # cannot see a suspended CronJob or a starved schedule.
        - alert: OpenStudioOperatorPruneJobFailed
          expr: kube_job_status_failed{namespace="openstudio-server", job_name=~"openstudio-storage-pruner-.+"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Storage-prune CronJob Jobs are failing
            description: >-
              kube_job_status_failed > 0 for a Job of the openstudio-storage-pruner
              CronJob — the prune entrypoint exited nonzero (3 empty spec.redisUrl
              #392, 4 CR-list failure, 5 D12 runtime failure). The storage-archival
              backlog grows while this fires. The failed Job is retained by
              failedJobsHistoryLimit so the alert persists until history GC (or manual
              deletion) clears it. Triage: kubectl get jobs -n openstudio-server -l
              app.kubernetes.io/component=storage-pruner, then read the Job pod logs;
              the per-pod-lifetime
              openstudio_operator_prune_tick_failures_total counter is best-effort
              only (README #470).
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics

        # Issue #569 — the absence-of-success complement the #468 set
        # deferred (see the comment on the failed-Job alert above). Every
        # signal in this manifest's other groups belongs to the OPERATOR
        # process (heartbeat, tick counters, event counters); the failed-Job
        # alert is event-driven (it needs a Job to reach Failed — since
        # #569 the activeDeadlineSeconds on the prune Job template makes a
        # hung pod do exactly that), but the no-event modes — CronJob
        # suspended (spec.suspend), schedule mutated wrong, controller
        # outage, Jobs never scheduled — produce nothing for it to key on
        # while the archival backlog grows toward an NFS-full outage
        # (#470). Expression shape is load-bearing: max_over_time, NOT
        # increase()/changes() — the prune tick runs seconds, so a Job can
        # appear, succeed and be scraped for the first time already at
        # succeeded=1 with no observed 0->1 transition for increase() to
        # count; and ``sum(...) or vector(0)`` keeps the expression
        # non-empty when successfulJobsHistoryLimit (3) has GC'd every
        # matching series — TRUE absence must evaluate to 0 and fire, not
        # vacuously match nothing. 1h window = 6 missed */10 schedules.
        # Requires kube-state-metrics like the sibling failed-Job alert.
        - alert: OpenStudioOperatorPruneJobNoSuccess
          expr: (sum(max_over_time(kube_job_status_succeeded{namespace="openstudio-server", job_name=~"openstudio-storage-pruner-.+"}[1h])) or vector(0)) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No successful storage-prune Job in over an hour
            description: >-
              No kube_job_status_succeeded=1 for an openstudio-storage-pruner-*
              Job in the last hour (6 missed */10 schedules) — the retention
              pipeline has not completed a tick. Either the CronJob is
              suspended / mis-scheduled, Jobs are never created, or (pre-#569
              manifests) a hung pod is pinning the Running Job under
              concurrencyPolicy: Forbid — post-#569 that pod is
              DeadlineExceeded-killed at 1800s and surfaces as
              OpenStudioOperatorPruneJobFailed, so cross-check that alert.
              The archival backlog grows while this fires; NFS fill (#470) is
              the end state. Triage: kubectl get cronjob
              openstudio-storage-pruner -n openstudio-server (suspend flag?
              lastScheduleTime?), kubectl get jobs -n openstudio-server -l
              app.kubernetes.io/component=storage-pruner, then the Job pod logs.
            runbook_url: https://github.com/anchapin/openstudio-server-operator#metrics
