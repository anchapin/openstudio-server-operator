# Mongo credential Secret for the kind-recipe web / web_background / worker
# pods (issue #219). The containers mount `MONGO_USER` and `MONGO_PASSWORD`
# from this Secret via `valueFrom.secretKeyRef` (see `web` / `web-background`
# / `worker` deployments).
#
# The committed password is the UNUSABLE sentinel
# `CHANGE_ME_RUN_ROTATE_SCRIPT` (issue #462). Every earlier committed
# placeholder was a real, publicly-known credential — the exact leak class
# issues #150/#219 closed, just renamed — so a fresh install that
# plain-applied this manifest shipped a guessable password guarding Mongo.
# The sentinel is not a working credential and no operator mistakes it for
# one; scripts/check_mongo_password_unique.sh fails the build on any value
# other than exactly this sentinel.
#
# To install a per-cluster random password (the ONLY working path):
#
#   scripts/rotate_mongo_password.sh
#
# …which generates a 32-char random password, substitutes it into this
# Secret (and the db Deployment) at apply time via `kubectl apply -f -`,
# and prints the value so you can persist it. Plain
# `kubectl apply -f deploy/mongo-credentials-secret.yaml` installs the
# sentinel — an intentionally non-working credential — so the rotation
# script MUST run first (see docs/onboarding.md §"Redis password is not a
# fixed literal (#150)" for the companion convention).
#
# The Mongo Deployment's `MONGO_INITDB_ROOT_USERNAME` / `MONGO_INITDB_ROOT_PASSWORD`
# (`scripts/manifests/01-mongo.yaml`) are rotated in lockstep by the same
# script — the substituted value must match the value substituted into this
# Secret, otherwise the pods will fail to authenticate.
#
# Note on the username: `username: openstudio` is the chart's default and is
# NOT a secret (the leak the rotation closes is the password). We keep the
# username literal in source to mirror the #150 Redis convention where the
# equivalent `username` field is empty — only the password is rotated.
# Helm-chart users who want a different username can edit the manifest before
# apply; the CI guard only rejects password values, never the username.
#
# Apply order:
#   1. scripts/rotate_mongo_password.sh   # installs a random password;
#      plain kubectl apply of this manifest installs only the sentinel
#   2. scripts/deploy-openstudio-stack.sh
apiVersion: v1
kind: Secret
metadata:
  name: openstudio-mongo
  namespace: openstudio-server
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # The rotation script substitutes this sentinel with the per-cluster
  # password at apply time (kind recipe: the substituted value must match
  # the db Deployment's MONGO_INITDB_ROOT_PASSWORD in
  # scripts/manifests/01-mongo.yaml; mounts into MONGO_USER / MONGO_PASSWORD
  # via valueFrom.secretKeyRef in 04-web.yaml / 05-web-background.yaml
  # / 06-worker.yaml).
  username: openstudio
  password: CHANGE_ME_RUN_ROTATE_SCRIPT
