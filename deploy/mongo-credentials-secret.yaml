# Mongo credential Secret for the kind-recipe web / web-background / worker
# pods (issue #219). The containers mount `MONGO_USER` and `MONGO_PASSWORD`
# from this Secret via `valueFrom.secretKeyRef` (see `web` / `web-background`
# / `worker` deployments).
#
# The committed password is `openstudio-rotated` (the legacy literal
# `openstudio` was a publicly-known default that shipped in source, defeating
# the kind-recipe cluster's auth boundary — same shape of leak #150 closed for
# Redis). To install a per-cluster random password (the recommended path),
# run:
#
#   scripts/rotate_mongo_password.sh
#
# …which generates a 32-char random password, writes it into this Secret in
# the live cluster, and prints the value so you can persist it.
#
# The Mongo Deployment's `MONGO_INITDB_ROOT_USERNAME` / `MONGO_INITDB_ROOT_PASSWORD`
# (`scripts/manifests/01-mongo.yaml`) are rotated in lockstep by the same
# script — the substituted value must match the value substituted into this
# Secret, otherwise the pods will fail to authenticate.
#
# Note on the username: `username: openstudio` is the chart's default and is
# NOT a secret (the leak the rotation closes is the password). We keep the
# username literal in source to mirror the #150 Redis convention where the
# equivalent `username` field is empty — only the password is rotated.
# Helm-chart users who want a different username can edit the manifest before
# apply; the CI guard only rejects `openstudio` as a PASSWORD value.
#
# Apply order:
#   1. kubectl apply -f deploy/mongo-credentials-secret.yaml
#      (or run scripts/rotate_mongo_password.sh to install a random one)
#   2. scripts/deploy-openstudio-stack.sh
apiVersion: v1
kind: Secret
metadata:
  name: openstudio-mongo
  namespace: openstudio-server
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # kind recipe: `openstudio / openstudio-rotated` (mounts into MONGO_USER /
  # MONGO_PASSWORD via valueFrom.secretKeyRef in 04-web.yaml / 05-web-background.yaml
  # / 06-worker.yaml). For a fresh cluster, run
  # `scripts/rotate_mongo_password.sh` to install a per-cluster random password.
  username: openstudio
  password: openstudio-rotated
