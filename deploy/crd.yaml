# OpenStudioClusterManager CRD — field names/defaults from the plan doc
# (section 3). names/scope/status-subresource added to satisfy apiextensions
# requirements for a namespaced CR with a status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstudioclustermanagers.energy.nrel.gov
spec:
  group: energy.nrel.gov
  scope: Namespaced
  names:
    plural: openstudioclustermanagers
    singular: openstudioclustermanager
    kind: OpenStudioClusterManager
    shortNames:
      - oscm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                serverUrl:
                  type: string
                  description: "Internal K8s DNS URL for OpenStudio web service."
                targetWorkerDeployment:
                  type: string
                  description: "Name of worker Deployment to manage/recycle."
                targetWebBackgroundDeployment:
                  type: string
                  description: "Name of web_background Deployment."
                analysisPolicy:
                  type: object
                  properties:
                    maxDurationMinutes:
                      type: integer
                      default: 180
                    gracefulStopTimeoutMinutes:
                      type: integer
                      default: 15
                    autoSoftStop:
                      type: boolean
                      default: true
                datapointPolicy:
                  type: object
                  properties:
                    maxDatapointRuntimeMinutes:
                      type: integer
                      default: 45
                    maxAutoRequeues:
                      type: integer
                      default: 3
                workerPolicy:
                  type: object
                  properties:
                    recycleWorkerIntervalHours:
                      type: integer
                      default: 12
                    recycleAfterAnalysis:
                      type: boolean
                      default: true
                storagePolicy:
                  type: object
                  properties:
                    archiveToS3:
                      type: boolean
                      default: false
                    s3BucketName:
                      type: string
                    purgeCompletedNFSFiles:
                      type: boolean
                      default: true
