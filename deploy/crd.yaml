# OpenStudioClusterManager CRD — field names/defaults from the plan doc
# (section 3), extended per issue #4 (grill decisions D03–D11): redisUrl,
# dryRun mutation gate, policy gates, backend-agnostic storagePolicy, and
# the .status durable-store schema (D04). names/scope/status-subresource
# satisfy apiextensions requirements for a namespaced CR with a status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstudioclustermanagers.energy.nrel.gov
spec:
  group: energy.nrel.gov
  scope: Namespaced
  names:
    plural: openstudioclustermanagers
    singular: openstudioclustermanager
    kind: OpenStudioClusterManager
    shortNames:
      - oscm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                serverUrl:
                  type: string
                  # Issue #160: the field was an unconstrained `type: string`, so a
                  # user with `create` on the OSCM CR could point the operator at any
                  # reachable endpoint (SSRF / credential-exfiltration surface). The
                  # pattern restricts the URL to http(s) against an in-cluster
                  # Service name, with an optional port and path.
                  #
                  # Shared SSRF host grammar (issue #575) — keep in sync across the
                  # three fence sites: crd.yaml spec.serverUrl pattern, crd.yaml
                  # spec.redisUrl pattern, and redis_client.SECRET_REDIS_URL_PATTERN.
                  # A legal host is exactly one of:
                  #   <service>                                  (web, queue)
                  #   <service>.svc[.cluster.local]              (web.svc,
                  #                                              web.svc.cluster.local)
                  #   <service>.<namespace>.svc[.cluster.local]  (web.openstudio-server.svc)
                  # Every multi-label host MUST terminate in .svc or
                  # .svc.cluster.local: a free two-label host (evil.com, exfil.io)
                  # is indistinguishable from a public TLD domain, so the bare
                  # service.namespace form is rejected — use the .svc-suffixed
                  # spelling instead. Non-HTTP schemes (ftp://) are rejected by the
                  # API server at apply time.
                  pattern: '^https?://[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.svc(\.cluster\.local)?|\.[a-z0-9]([-a-z0-9]*[a-z0-9])?\.svc(\.cluster\.local)?)?(:[0-9]{1,5})?(/.*)?$'
                  x-kubernetes-validations:
                    - rule: "self.startsWith('http://') || self.startsWith('https://')"
                      message: "spec.serverUrl must be an in-cluster http:// or https:// URL (issue #160)."
                  description: "Internal K8s DNS URL for OpenStudio web service. Must be an in-cluster http(s) Service URL (issue #160)."
                redisUrl:
                  type: string
                  default: ""
                  # Issue #390: the field was an unconstrained `type: string`, so
                  # a CR-write user could redirect the operator's `ReadOnlyRedisClient`
                  # (`src/openstudio_operator/redis_client.py`) at any reachable
                  # host and coerce the Resque keyspace probe to talk to it
                  # (SSRF / hostile-Redis exfiltration). The pattern restricts the
                  # URL to ``redis://`` against an in-cluster Service name, with
                  # optional port and ``/<db>`` selector. Non-Redis schemes
                  # (``http://``, ``ftp://``) are rejected by the API server at
                  # apply time. The trailing ``|^$`` branch preserves the #116
                  # empty-default escape hatch.
                  #
                  # Shared SSRF host grammar (issue #575) — keep in sync across the
                  # three fence sites: crd.yaml spec.serverUrl pattern, crd.yaml
                  # spec.redisUrl pattern, and redis_client.SECRET_REDIS_URL_PATTERN.
                  # A legal host is exactly one of:
                  #   <service>                                  (web, queue)
                  #   <service>.svc[.cluster.local]              (web.svc,
                  #                                              web.svc.cluster.local)
                  #   <service>.<namespace>.svc[.cluster.local]  (web.openstudio-server.svc)
                  # Every multi-label host MUST terminate in .svc or
                  # .svc.cluster.local: a free two-label host (evil.com, exfil.io)
                  # is indistinguishable from a public TLD domain, so the bare
                  # service.namespace form is rejected — use the .svc-suffixed
                  # spelling instead.
                  # Issue #463: the pre-#463 pattern allowed an optional
                  # ``([^@]+@)?`` userinfo group, which let the queue-fabric
                  # password ride inline in the CR spec — stored plaintext in
                  # etcd, returned verbatim to every `get/list` principal, and
                  # committed to GitOps repos. The auth group is REMOVED:
                  # embedded credentials (``redis://:password@queue`` or
                  # ``redis://user:pass@queue``) are now rejected at apply time.
                  # Credentials belong in a Secret named by
                  # ``spec.redisCredentials.secretRef`` (full-URL semantics);
                  # ``redis://queue:6379`` (credential-free, for no-auth dev
                  # clusters) remains accepted.
                  # Issue #476: the ``rediss?://`` scheme alternation accepts
                  # the TLS twin (``rediss://queue:6379`` — TLS-only Azure
                  # Cache / Memorystore / ElastiCache shapes) everywhere the
                  # plaintext scheme is accepted; the in-cluster host fence
                  # and the #463 no-credentials rule are unchanged.
                  pattern: '^rediss?://[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.svc(\.cluster\.local)?|\.[a-z0-9]([-a-z0-9]*[a-z0-9])?\.svc(\.cluster\.local)?)?(:[0-9]{1,5})?(/[0-9]+)?$|^$'
                  x-kubernetes-validations:
                    - rule: "self == '' || self.startsWith('redis://') || self.startsWith('rediss://')"
                      message: "spec.redisUrl must be empty or an in-cluster redis:// or rediss:// (TLS) Service URL (issue #390, #476)."
                    - rule: "self == '' || !self.contains('@')"
                      message: "spec.redisUrl must not carry embedded credentials (issue #463); store the full URL in a Secret and reference it via spec.redisCredentials.secretRef."
                  description: |
                    Redis (Resque) URL for read-only queue-depth checks.
                    Issue #116: the default is intentionally EMPTY — the historical
                    default `redis://:openstudio@queue....` baked the kind-recipe
                    password `openstudio` into every published CRD, so a fresh
                    deploy that did not override the field shipped a public-facing
                    password. The operator now refuses to start when this is
                    empty AND spec.redisCredentials.secretRef is unset (see
                    handlers/__init__.py startup guard). Issue #390 locks the
                    value to an in-cluster `redis://` Service URL (or empty per
                    #116). Issue #463 REJECTS embedded credentials (`@` userinfo):
                    the CR spec is stored plaintext in etcd and mirrored into
                    GitOps repos, so the password belongs in a Secret referenced
                    via `spec.redisCredentials.secretRef` (recommended — see
                    docs/onboarding.md) — `redis://queue:6379` without credentials
                    stays valid for no-auth clusters. Issue #476: `rediss://`
                    connects with TLS (certificate verification against the
                    system trust store by default; optional explicit CA bundle
                    via the REDIS_TLS_CA_BUNDLE env var on the operator).
                redisCredentials:
                  type: object
                  description: "Secret-sourced Redis credentials (issue #463). Preferred over spec.redisUrl when both are set."
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      description: "Names the Secret key holding the FULL redis://... URL (redis://:password@queue:6379) — not the bare password. Resolved by the operator via a single namespaced CoreV1 get (the bounded 'never reads Secrets' exception, issue #463)."
                      required: [name, key]
                      properties:
                        name:
                          type: string
                          # Issue #463 / #240-style fence: an unconstrained name
                          # let a CR-write user point the operator's one Secret
                          # read at ANY Secret in the namespace (TLS, registry,
                          # operator-managed credentials). The pattern pins the
                          # value to the documented `openstudio-redis*`
                          # convention (deploy/redis-credentials-secret.yaml and
                          # rotations of it); the CEL rule gives a readable
                          # apply-time message for the same constraint.
                          #
                          # Issue #606: the pattern deliberately stays WIDER
                          # than the enforcement. The DEFAULT operator Role
                          # (deploy/rbac.yaml) grants secrets:get only on the
                          # canonical name(s) via RBAC resourceNames
                          # (['openstudio-redis']); a custom `openstudio-redis-*`
                          # name is apply-legal here and fails at READ time
                          # (403 → RedisCredentialResolutionError → key-layout
                          # "unreachable" + counted skip-ticks + a one-time
                          # RedisSecretRefForbidden Warning from the singleton
                          # guard). Narrowing this pattern to one fixed name
                          # would make the field pointless and break existing
                          # CRs at their next spec update — exact-name
                          # enforcement belongs at the RBAC layer (resourceNames),
                          # the mechanism Kubernetes provides for it. A cluster
                          # admin allows a custom name by adding it to the
                          # Role's resourceNames (deliberate, visible,
                          # reviewable).
                          maxLength: 253
                          pattern: '^openstudio-redis[a-z0-9-]*$'
                          x-kubernetes-validations:
                            - rule: "self.startsWith('openstudio-redis')"
                              message: "spec.redisCredentials.secretRef.name must match '^openstudio-redis[a-z0-9-]*$' (issue #463)."
                          description: "Name of a Secret in this namespace. Must match the openstudio-redis* naming convention (issue #463). The DEFAULT operator Role (deploy/rbac.yaml) grants secrets:get only on the canonical name(s) via resourceNames (default: 'openstudio-redis', issue #606) — a custom name requires adding it there and fails at read time (403) until the Role is widened."
                        key:
                          type: string
                          # Secret keys are [-._a-zA-Z0-9] per the K8s API; this
                          # pattern rejects empty values and embedded whitespace.
                          maxLength: 253
                          pattern: '^[A-Za-z0-9][-A-Za-z0-9._]*$'
                          description: "Secret key holding the full redis:// URL (e.g. 'redis-url'). No default; always explicit."
                dryRun:
                  type: boolean
                  default: false
                  description: "Gates every mutating action (D11). Default false; when true, mutations are suppressed and emitted as dry-run-marked Events."
                targetWorkerDeployment:
                  type: string
                  # Issue #160: unconstrained, this field let a CR-write user
                  # redirect `patch_namespaced_deployment` (worker_recycler) at any
                  # Deployment in the namespace and trigger a rolling restart of it.
                  # DNS-1035 pattern rejects slashes/uppercase/namespaced paths; the
                  # CEL rule pins the value to the two Deployments the operator is
                  # actually allowed to manage.
                  maxLength: 63
                  pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: "self in ['worker', 'web-background']"
                      message: "spec.targetWorkerDeployment must be 'worker' or 'web-background' (issue #160)."
                  description: "Name of worker Deployment to manage/recycle. Restricted to 'worker' or 'web-background' (issue #160)."
                targetWebBackgroundDeployment:
                  type: string
                  # Issue #160: same escalation path via web_background_monitor's
                  # restart patch — constrained identically.
                  maxLength: 63
                  pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: "self in ['worker', 'web-background']"
                      message: "spec.targetWebBackgroundDeployment must be 'worker' or 'web-background' (issue #160)."
                  description: "Name of web_background Deployment. Restricted to 'worker' or 'web-background' (issue #160)."
                analysisPolicy:
                  type: object
                  # Issue #170: grace period must be strictly less than the SLA
                  # budget, otherwise escalation is unreachable. Enforced via
                  # CEL so the API server rejects a CR with
                  # gracefulStopTimeoutMinutes >= maxDurationMinutes at apply
                  # time. The `has()` guard means an unset field (the API
                  # server falls back to the defaults below) doesn't trip the
                  # rule.
                  x-kubernetes-validations:
                    - rule: "!has(self.maxDurationMinutes) || !has(self.gracefulStopTimeoutMinutes) || self.gracefulStopTimeoutMinutes < self.maxDurationMinutes"
                      message: "spec.analysisPolicy.gracefulStopTimeoutMinutes must be strictly less than spec.analysisPolicy.maxDurationMinutes (issue #170)."
                  properties:
                    maxDurationMinutes:
                      type: integer
                      minimum: 1
                      default: 180
                    gracefulStopTimeoutMinutes:
                      type: integer
                      minimum: 1
                      default: 15
                    autoSoftStop:
                      type: boolean
                      default: true
                    forceDeleteOnEscalation:
                      type: boolean
                      default: false
                      description: "Allow escalating a stuck analysis to worker-pod eviction after the grace period. Default false."
                datapointPolicy:
                  type: object
                  properties:
                    maxDatapointRuntimeMinutes:
                      type: integer
                      minimum: 1
                      default: 45
                    maxAutoRequeues:
                      type: integer
                      # Issue #170: zero requeues is a documented valid setting
                      # (operators may opt to disable auto-requeue entirely);
                      # negative would be a bug. Floor is 0, not 1.
                      minimum: 0
                      default: 3
                workerPolicy:
                  type: object
                  properties:
                    recycleWorkerIntervalHours:
                      type: integer
                      minimum: 1
                      default: 12
                    recycleAfterAnalysis:
                      type: boolean
                      default: true
                    minRecycleIntervalMinutes:
                      type: integer
                      minimum: 1
                      default: 30
                      description: "Minimum spacing between worker recycles. Default 30."
                webBackgroundPolicy:
                  type: object
                  description: "web_background queue-stall detection settings."
                  properties:
                    stallWindowMinutes:
                      type: integer
                      minimum: 1
                      default: 10
                      description: "Minutes without queue progress before a web_background restart is considered. Default 10."
                storagePolicy:
                  type: object
                  properties:
                    archiveToS3:
                      type: boolean
                      default: false
                      description: "Enable archival of completed-analysis assets. Default false."
                    backend:
                      type: string
                      enum: [s3, gcs, azure]
                      description: "Archival backend. One of: s3, gcs, azure. No default; set when archiveToS3 is true."
                    bucket:
                      type: string
                      description: "Destination bucket name (backend-agnostic)."
                    secretRef:
                      type: string
                      # Issue #240: unconstrained, this field let a CR-write
                      # user point `archival.py`'s envFrom at ANY Secret in
                      # the openstudio-server namespace — openstudio-redis
                      # (KEDA TriggerAuthentication password), any TLS
                      # Secret, any docker-registry Secret, any
                      # operator-managed credential. The rclone process
                      # reads every key in the named Secret as an env var
                      # and could exfiltrate it via `rclone config` (which
                      # reads `RCLONE_CONFIG_*` env vars). The
                      # DNS-1035-style pattern locks the name to the
                      # documented `os-archive-<suffix>` convention used by
                      # the test fixtures (`os-archive-creds`) and the
                      # runbooks; the CEL rule gives a readable apply-time
                      # message for the same constraint.
                      pattern: '^os-archive-[a-z0-9-]+$'
                      x-kubernetes-validations:
                        - rule: "self.startsWith('os-archive-')"
                          message: "spec.storagePolicy.secretRef must match '^os-archive-[a-z0-9-]+$' (issue #240)."
                      description: "Name of a Secret in this namespace; mounted into archival Jobs via envFrom — never read by the operator. Must match the os-archive-<suffix> naming convention (issue #240)."
                    retentionDays:
                      type: integer
                      # Issue #170: 0 is the documented "archive immediately"
                      # sentinel (deliberate); negatives widen the eligibility
                      # window to the past and create a one-way data-loss path
                      # through the archival-then-delete pipeline. Floor is 0.
                      minimum: 0
                      default: 7
                      description: "Days a completed analysis is retained before archival. Default 7; 0 = archive immediately."
                    purgeCompletedNFSFiles:
                      type: boolean
                      default: true
            status:
              type: object
              description: "Operator durable state (D04); pruned as analyses/datapoints complete. Written via the status subresource."
              properties:
                softStops:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Map keyed by analysis id to soft-stop records (issued-at timestamp, outcome)."
                requeues:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Map keyed by datapoint id to auto-requeue records (count, last requeued-at timestamp)."
                startedSince:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Map keyed by datapoint id to the ISO-8601 UTC timestamp when the operator first observed it started (operator clock)."
                archivedAnalyses:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Map keyed by analysis id to archival records (backend, bucket, verified-upload timestamp)."
                lastRecycleAt:
                  type: string
                  format: date-time
                  description: "ISO-8601 UTC timestamp of the last worker recycle. No default; unset until the first recycle."
                lastWebBackgroundRestart:
                  type: string
                  format: date-time
                  description: "ISO-8601 UTC timestamp of the last web_background restart. No default; unset until the first restart."
                stallWindowStartedAt:
                  type: string
                  format: date-time
                  description: "ISO-8601 UTC timestamp when the current web_background stall window began (issue #582). Checkpointed when a stall begins, cleared when the window breaks or a restart fires, restored into the tracker on the first tick after an operator restart so a sustained stall survives process bounces (D04). Unset when no stall window is in progress."
                deferredEvents:
                  type: array
                  description: "Pending deferred Warning Events (issue #402): entries the operator queued for emission on the next OSCM watch tick, mirrored from the in-process queue so an operator crash does not silently lose them. Drained (emitted then cleared) on the next watch tick; at-least-once."
                  items:
                    type: object
                    required: [namespace, name, reason, message]
                    properties:
                      namespace:
                        type: string
                        description: "Namespace of the CR the Warning targets (redundant with the containing CR; kept so the stored shape matches the in-memory tuple)."
                      name:
                        type: string
                        description: "Name of the CR the Warning targets."
                      reason:
                        type: string
                        description: "Kubernetes Event reason (RedisUrlEmpty, RedisKeyLayoutDrift, StatusMapCapped, ...)."
                      message:
                        type: string
                        description: "Human-readable Warning message."
