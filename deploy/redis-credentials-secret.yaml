# Redis credential Secret for the KEDA ScaledObject's TriggerAuthentication
# (issue #77). The KEDA metrics adapter reads this Secret at query time —
# the operator never sees the password.
#
# The password matches the kind recipe's scripts/manifests/02-redis.yaml
# (`--requirepass openstudio`). On a production cluster, replace the
# value with the chart's actual Redis password (the same one the operator
# reads via `spec.redisUrl`).
#
# Apply order:
#   1. kubectl apply -f deploy/redis-credentials-secret.yaml
#   2. scripts/install-keda.sh   (or helm install keda ...)
#   3. kubectl apply -f deploy/keda-scaledobject.yaml
apiVersion: v1
kind: Secret
metadata:
  name: openstudio-redis
  namespace: openstudio-server
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: autoscaling
type: Opaque
stringData:
  # kind recipe: `redis-server --requirepass openstudio` (02-redis.yaml)
  # Production: substitute the chart's actual password (same value the
  # operator's `spec.redisUrl` embeds).
  password: openstudio
