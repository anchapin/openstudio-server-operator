# Redis credential Secret for the KEDA ScaledObject's TriggerAuthentication
# (issue #77). The KEDA metrics adapter reads this Secret at query time —
# the operator never sees the password.
#
# The committed password is `openstudio-rotated` (issue #150). The legacy
# literal `openstudio` was a publicly-known default that shipped in source,
# defeating the kind-recipe cluster's auth boundary. To install a per-cluster
# random password (the recommended path), run:
#
#   scripts/rotate_redis_password.sh
#
# …which generates a 32-char random password, writes it into this Secret
# in the live cluster, and prints the value so you can persist it.
#
# Apply order:
#   1. kubectl apply -f deploy/redis-credentials-secret.yaml
#      (or run scripts/rotate_redis_password.sh to install a random one)
#   2. scripts/install-keda.sh   (or helm install keda ...)
#   3. kubectl apply -f deploy/keda-scaledobject.yaml
#   4. (kind recipe only) scripts/deploy-openstudio-stack.sh — the rotated
#      password must match the value substituted into the web / web-background
#      / worker `REDIS_URL` env vars + the redis `--requirepass` arg.
apiVersion: v1
kind: Secret
metadata:
  name: openstudio-redis
  namespace: openstudio-server
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: autoscaling
type: Opaque
stringData:
  # kind recipe: `redis-server --requirepass openstudio-rotated` (02-redis.yaml)
  # Production: substitute the chart's actual password (same value the
  # operator's `spec.redisUrl` embeds). For a fresh cluster, run
  # `scripts/rotate_redis_password.sh` to install a per-cluster random password.
  password: openstudio-rotated
