# Redis credential Secret for the KEDA ScaledObject's TriggerAuthentication
# (issue #77). The KEDA metrics adapter reads this Secret at query time —
# the operator never sees the `password` key.
#
# Issue #463 note: for `spec.redisCredentials.secretRef` add a SEPARATE key
# (e.g. `redis-url`) holding the FULL `redis://:password@queue:6379` URL —
# full-URL semantics; the operator reads only that one named key via a
# single namespaced get (see deploy/rbac.yaml). The `password` key below
# stays KEDA-only.
#
# The committed password is the UNUSABLE sentinel
# `CHANGE_ME_RUN_ROTATE_SCRIPT` (issue #462). Every earlier committed
# placeholder was a real, publicly-known credential — the exact leak class
# issues #150/#219 closed, just renamed — so a fresh install that
# plain-applied this manifest shipped a guessable password guarding the
# Resque queue fabric. The sentinel is not a working credential and no
# operator mistakes it for one; scripts/check_redis_password_unique.sh
# fails the build on any value other than exactly this sentinel.
#
# To install a per-cluster random password (the ONLY working path):
#
#   scripts/rotate_redis_password.sh
#
# …which generates a 32-char random password, substitutes it into this
# Secret (and the kind-recipe manifests) at apply time via
# `kubectl apply -f -`, and prints the value so you can persist it.
# Plain `kubectl apply -f deploy/redis-credentials-secret.yaml` installs
# the sentinel — an intentionally non-working credential — so the
# rotation script MUST run first (see docs/onboarding.md §"Redis password
# is not a fixed literal (#150)").
#
# Apply order:
#   1. scripts/rotate_redis_password.sh   # installs a random password;
#      plain kubectl apply of this manifest installs only the sentinel
#   2. scripts/install-keda.sh   (or helm install keda ...)
#   3. kubectl apply -f deploy/keda-scaledobject.yaml
#   4. (kind recipe only) scripts/deploy-openstudio-stack.sh — the rotated
#      password must match the value substituted into the web / web_background
#      / worker `REDIS_URL` env vars + the redis `--requirepass` arg.
apiVersion: v1
kind: Secret
metadata:
  name: openstudio-redis
  namespace: openstudio-server
  labels:
    app.kubernetes.io/managed-by: openstudio-operator
    app.kubernetes.io/component: autoscaling
type: Opaque
stringData:
  # The rotation script substitutes this sentinel with the per-cluster
  # password at apply time. Kind recipe: the substituted value must match
  # the redis `--requirepass` arg in scripts/manifests/02-redis.yaml and
  # the web / web-background / worker `REDIS_URL` env vars (the same value
  # the operator's `spec.redisUrl` embeds). Production: substitute the
  # chart's actual password.
  password: CHANGE_ME_RUN_ROTATE_SCRIPT
