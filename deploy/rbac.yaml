# Least-privilege RBAC — namespaced Role only, never a ClusterRole (per plan
# section 7 / AGENTS.md). Verbs are enumerated; keep it that way.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openstudio-operator-sa
  namespace: openstudio-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstudio-operator-role
  namespace: openstudio-server
rules:
  # Manage Custom Resources — #228 enumerated verbs (drop wildcard);
  # #643 trimmed dead verbs to the exercised + kopf-framework set (see
  # tests/test_rbac_call_surface.py — the RBAC-vs-client-calls drift gate).
  # The CR itself is read-only from the operator: the singleton guard polls
  # list_namespaced_custom_object; kopf's streaming machinery additionally
  # needs get+watch (framework allowlist, no call site in src/). The status
  # subresource needs exactly get+patch for the StatusStore read-modify-write
  # helper (get_namespaced_custom_object_status +
  # patch_namespaced_custom_object_status) — #643 dropped list/watch (not
  # servable on a subresource) and update (no call site; the RMW patches).
  # No delete/deletecollection/create/bind — a compromised operator pod
  # cannot wholesale-delete the OSCM CR and bypass the singleton guard.
  - apiGroups: ["energy.nrel.gov"]
    resources: ["openstudioclustermanagers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["energy.nrel.gov"]
    resources: ["openstudioclustermanagers/status"]
    verbs: ["get", "patch"]
  # Manage Worker Deployments & Pod Restarts. Issue #573: the grant is
  # namespace-wide (RBAC has no workable per-name slot for a
  # CR-configurable target); the admission-layer companion narrowing
  # this SA's Deployment patch surface to the `worker` and
  # `web-background` names lives in
  # deploy/deployment-patch-admission-policy.yaml.
  # #643: get+patch only — the code calls read_namespaced_deployment and
  # patch_namespaced_deployment (_k8s.py); list/watch/update had no call
  # sites.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # Read pods; delete for surgical escalation of zombie datapoint workers (#9).
  # #643: list+delete only — the code calls list_namespaced_pod
  # (analysis_sla / web_background_monitor) and delete_namespaced_pod
  # (analysis_sla zombie eviction); get/watch had no call sites.
  # Issue #293: native RBAC has no label-selector slot, so the
  # `pods/delete` verb is unconstrained in this manifest — any pod in
  # the namespace is deletable by the operator SA. The defense-in-depth
  # narrowing lives in deploy/pod-delete-admission-policy.yaml: a
  # ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1) rejects
  # operator-SA pod deletes that don't target a pod labeled
  # `app=worker` (the helm chart's worker Deployment pod selector).
  # The policy's CEL rule short-circuits for non-operator actors, so
  # humans via kubectl and the prune CronJob SA keep their normal
  # pod-delete access; only this SA's destructive surface is narrowed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  # Emit Kubernetes Events (soft-stop / recycle / dry-run markers).
  # #643: create only — Events are posted exclusively through kopf.event
  # (kopf internally calls create_namespaced_event; framework allowlist in
  # tests/test_rbac_call_surface.py); get/list/watch/patch had no call
  # sites in the operator process.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  # NOTE (#715): the `secrets: get` rule that lived here pre-#715 moved
  # to its own narrower Role (`openstudio-redis-secret-reader-role`)
  # below, with its own narrower RoleBinding wired to the same operator
  # SA. The operator's `secrets` verbs now come ONLY from that narrower
  # Role — a future PR that re-merges a `secrets` rule into this broader
  # Role fails `test_operator_role_has_no_secrets_rule` in
  # tests/test_rbac_narrower_role.py. The full multi-layer rationale
  # (RBAC resourceNames #606 / CRD pattern #463 / VAP mutation-fence
  # #572 / AST-gated call site in client_factory._resolve_redis_url)
  # lives with the narrower Role below where the rule itself lives.
  # NOTE (#77): the autoscaling/horizontalpodautoscalers rule is GONE.
  # The custom HPA-floor adjuster (#18) was removed; autoscaling is now
  # owned by KEDA (deploy/keda-scaledobject.yaml) which runs under its own
  # ServiceAccount and manages the ScaledObject + HPA from outside the
  # operator process. The operator no longer touches HorizontalPodAutoscalers.
  # NOTE (#78): no batch/jobs rule anymore — the storage retention pipeline
  # (archival Job spawn/watch/cleanup) moved out of the operator into the
  # storage-prune CronJob, whose ServiceAccount holds its own least-privilege
  # Role in deploy/storage-cronjob.yaml. See docs/architecture-plan.md
  # Module 4 for the before/after RBAC quantification.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstudio-operator-rb
  namespace: openstudio-server
subjects:
  - kind: ServiceAccount
    name: openstudio-operator-sa
    namespace: openstudio-server
roleRef:
  kind: Role
  name: openstudio-operator-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- Issue #715: narrower Role carries the operator's only
# `secrets: get` grant ----------------------------------------------
#
# Pre-#715 the operator's secrets: get lived in the broad
# `openstudio-operator-role` (the cross-cutting namespaced Role carrying
# every operator surface — OSCM, deployments, pods, events), bounded
# only by `resourceNames: ["openstudio-redis"]`. #606 closed the
# namespace-wide read by adding that constraint, but the `secrets`
# verb was still one of seven rules in a single Role — a future PR
# that adds another Secret name to `resourceNames` (e.g. for a new
# credential backend), or that loosens the rule any other way, would
# silently widen the read without anyone touching the dedicated
# surface.
#
# #715 splits that rule into its own narrower Role+Binding pair. The
# operator SA's effective `secrets` verbs now come ONLY from this Role
# — the broad `openstudio-operator-role` carries no `secrets` rule at
# all. The threat model the AGENTS.md "never reads secrets" rule
# describes (a compromised operator pod could read ANY Secret in the
# namespace) is closed by RBAC shape alone: any future PR that
# re-merges a `secrets` verb into `openstudio-operator-role` fails
# `test_operator_role_has_no_secrets_rule` and
# `test_operator_sa_secrets_verbs_only_flow_through_narrower_role` in
# tests/test_rbac_narrower_role.py.
#
# Same bounded exception (issue #463) — `client_factory._resolve_redis_url`
# is the bounded read site. The four-layer fence that justified the
# single in-Role rule pre-#715 carries over verbatim; only WHERE the
# RBAC `secrets` rule lives changed (the audit footprint is smaller,
# the operational behavior is identical):
#
#   1. RBAC exact-name (this rule, #606): `get` ONLY, and only on the
#      canonical Secret name(s) the shipped tooling creates —
#      `openstudio-redis` (deploy/redis-credentials-secret.yaml +
#      scripts/rotate_redis_password.sh). Pre-#606 the grant was
#      namespace-wide `get`, so a compromised operator pod could read
#      ANY Secret here (Mongo credentials, rclone cloud creds, TLS
#      bundles, metrics bearer tokens) — the exfiltration path #606
#      closes. resourceNames is an exact-name list; RBAC has no
#      pattern slot.
#   2. CRD pattern (#463): `^openstudio-redis[a-z0-9-]*$` on
#      spec.redisCredentials.secretRef.name — a CR-write principal
#      cannot redirect the read at arbitrary names at apply time.
#   3. Admission mutation-fence (#572):
#      deploy/secret-read-admission-policy.yaml narrows this SA's
#      Secret MUTATIONS to `openstudio-redis*` names (RBAC-drift
#      insurance; VAPs cannot intercept GET — admission runs on the
#      mutating path only).
#   4. Single AST-gated construction site: the operator's one
#      `secrets: get` call lives in client_factory._resolve_redis_url
#      (tests/test_singleton_registry_coverage.py).
#
# Trade-off (#606 Option 1, fail-visible variant): the CRD pattern
# allows any `openstudio-redis*` name, but this Role grants GET on the
# canonical name(s) ONLY. A CR naming a custom `openstudio-redis-*`
# Secret is apply-legal and fails at READ time: 403 →
# RedisCredentialResolutionError → key-layout "unreachable" + counted
# skip-ticks + a one-time RedisSecretRefForbidden Warning Event telling
# the SRE the two remedies (singleton guard, #606). To allow a custom
# name, a cluster admin adds it to resourceNames below — a deliberate,
# visible, reviewable RBAC change. (Narrowing the CRD pattern to one
# fixed name instead would make the field pointless and break existing
# CRs at their next spec update; exact-name enforcement belongs at the
# RBAC layer — the mechanism Kubernetes provides for exactly this.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstudio-redis-secret-reader-role
  namespace: openstudio-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["openstudio-redis"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstudio-redis-secret-reader-rb
  namespace: openstudio-server
subjects:
  - kind: ServiceAccount
    name: openstudio-operator-sa
    namespace: openstudio-server
roleRef:
  kind: Role
  name: openstudio-redis-secret-reader-role
  apiGroup: rbac.authorization.k8s.io
