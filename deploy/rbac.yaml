# Least-privilege RBAC — namespaced Role only, never a ClusterRole (per plan
# section 7 / AGENTS.md). Verbs are enumerated; keep it that way.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openstudio-operator-sa
  namespace: openstudio-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstudio-operator-role
  namespace: openstudio-server
rules:
  # Manage Custom Resources — #228 enumerated verbs (drop wildcard).
  # The CR itself is read-only from the operator: the singleton guard polls
  # list_namespaced_custom_object, so get+list+watch is sufficient. The
  # status subresource additionally needs patch+update for the StatusStore
  # read-modify-write helper (get_namespaced_custom_object_status +
  # patch_namespaced_custom_object_status). No delete/deletecollection/
  # create/bind — a compromised operator pod cannot wholesale-delete the
  # OSCM CR and bypass the singleton guard.
  - apiGroups: ["energy.nrel.gov"]
    resources: ["openstudioclustermanagers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["energy.nrel.gov"]
    resources: ["openstudioclustermanagers/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Manage Worker Deployments & Pod Restarts. Issue #573: the grant is
  # namespace-wide (RBAC has no workable per-name slot for a
  # CR-configurable target); the admission-layer companion narrowing
  # this SA's Deployment patch/update surface to the `worker` and
  # `web-background` names lives in
  # deploy/deployment-patch-admission-policy.yaml.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Read pods; delete for surgical escalation of zombie datapoint workers (#9).
  # Issue #293: native RBAC has no label-selector slot, so the
  # `pods/delete` verb is unconstrained in this manifest — any pod in
  # the namespace is deletable by the operator SA. The defense-in-depth
  # narrowing lives in deploy/pod-delete-admission-policy.yaml: a
  # ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1) rejects
  # operator-SA pod deletes that don't target a pod labeled
  # `app=worker` (the helm chart's worker Deployment pod selector).
  # The policy's CEL rule short-circuits for non-operator actors, so
  # humans via kubectl and the prune CronJob SA keep their normal
  # pod-delete access; only this SA's destructive surface is narrowed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Emit Kubernetes Events (soft-stop / recycle / dry-run markers)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Read ONE Secret by name for Redis connection info (issue #463) —
  # exact-name-bounded by RBAC resourceNames (issue #606).
  #
  # TENSION with the "operator never reads secrets" rule, documented here
  # on purpose: `spec.redisCredentials.secretRef` names a Secret whose key
  # holds the full redis:// URL, and the acceptance criterion requires the
  # operator itself to resolve it (client_factory._resolve_redis_url — the
  # rclone-style envFrom hand-off is not available for an in-process
  # client constructor). This is the bounded exception, fenced in layers:
  #
  #   1. RBAC exact-name (this rule, #606): `get` ONLY, and only on the
  #      canonical Secret name(s) the shipped tooling creates —
  #      `openstudio-redis` (deploy/redis-credentials-secret.yaml +
  #      scripts/rotate_redis_password.sh). Pre-#606 the grant was
  #      namespace-wide `get`, so a compromised operator pod could read
  #      ANY Secret here (Mongo credentials, rclone cloud creds, TLS
  #      bundles, metrics bearer tokens) — the exfiltration path #606
  #      closes. resourceNames is an exact-name list; RBAC has no
  #      pattern slot.
  #   2. CRD pattern (#463): `^openstudio-redis[a-z0-9-]*$` on
  #      spec.redisCredentials.secretRef.name — a CR-write principal
  #      cannot redirect the read at arbitrary names at apply time.
  #   3. Admission mutation-fence (#572):
  #      deploy/secret-read-admission-policy.yaml narrows this SA's
  #      Secret MUTATIONS to `openstudio-redis*` names (RBAC-drift
  #      insurance; VAPs cannot intercept GET — admission runs on the
  #      mutating path only).
  #   4. Single AST-gated construction site: the operator's one
  #      `secrets: get` call lives in client_factory._resolve_redis_url
  #      (tests/test_singleton_registry_coverage.py).
  #
  # Trade-off (#606 Option 1, fail-visible variant): the CRD pattern
  # allows any `openstudio-redis*` name, but this Role grants GET on the
  # canonical name(s) ONLY. A CR naming a custom `openstudio-redis-*`
  # Secret is apply-legal and fails at READ time: 403 →
  # RedisCredentialResolutionError → key-layout "unreachable" + counted
  # skip-ticks + a one-time RedisSecretRefForbidden Warning Event telling
  # the SRE the two remedies (singleton guard, #606). To allow a custom
  # name, a cluster admin adds it to resourceNames below — a deliberate,
  # visible, reviewable RBAC change. (Narrowing the CRD pattern to one
  # fixed name instead would make the field pointless and break existing
  # CRs at their next spec update; exact-name enforcement belongs at the
  # RBAC layer — the mechanism Kubernetes provides for exactly this.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["openstudio-redis"]
  # NOTE (#77): the autoscaling/horizontalpodautoscalers rule is GONE.
  # The custom HPA-floor adjuster (#18) was removed; autoscaling is now
  # owned by KEDA (deploy/keda-scaledobject.yaml) which runs under its own
  # ServiceAccount and manages the ScaledObject + HPA from outside the
  # operator process. The operator no longer touches HorizontalPodAutoscalers.
  # NOTE (#78): no batch/jobs rule anymore — the storage retention pipeline
  # (archival Job spawn/watch/cleanup) moved out of the operator into the
  # storage-prune CronJob, whose ServiceAccount holds its own least-privilege
  # Role in deploy/storage-cronjob.yaml. See docs/architecture-plan.md
  # Module 4 for the before/after RBAC quantification.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstudio-operator-rb
  namespace: openstudio-server
subjects:
  - kind: ServiceAccount
    name: openstudio-operator-sa
    namespace: openstudio-server
roleRef:
  kind: Role
  name: openstudio-operator-role
  apiGroup: rbac.authorization.k8s.io
