[project]
name = "openstudio-server-operator"
version = "0.1.0"
description = "Kubernetes operator automating OpenStudio Server operations: analysis soft-stops, zombie datapoint requeues, worker recycling, NFS archival/pruning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upper bound guards against silent singleton-guard wrap removal (see #47):
    # ``singleton.install_singleton_guard`` reaches into kopf's private
    # ``registry._spawning._handlers`` (1.37+) — a kopf upgrade can rename or
    # move that internal without crashing, and the failure mode is silently
    # unwrapped handlers (D05 enforcement quietly disabled). The
    # ``tests/test_singleton_registry_coverage.py`` CI gate fails loudly if
    # the internals change shape, but we still require a deliberate bump here.
    "kopf>=1.37,<1.45",
    "kubernetes>=29.3.0",
    "redis>=5.0", # read-only queue-fabric client (#12)
    "requests>=2.32.0",
    "prometheus-client>=0.20.0", # Phase 4: /metrics endpoint
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Minimum keeps local rule sets aligned with CI (see #68): CI installs
    # latest ruff (0.16.3 at time of writing) and activated rules the old
    # local floor (0.5.0 / actual 0.14.5) missed — TRY004 (#59) and RUF059
    # (#64) each cost a CI fix-up cycle. CI pins the same floor in
    # .github/workflows/ci.yml.
    "ruff>=0.16",
    "responses>=0.25.0", # mock OpenStudio REST API in tests
    "fakeredis>=2.23", # mock Redis for the read-only client tests (#12)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openstudio_operator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
