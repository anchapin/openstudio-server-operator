[project]
name = "openstudio-server-operator"
version = "0.1.0"
description = "Kubernetes operator automating OpenStudio Server operations: analysis soft-stops, zombie datapoint requeues, worker recycling, NFS archival/pruning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upper bound guards against silent singleton-guard wrap removal (see #47):
    # ``singleton.install_singleton_guard`` reaches into kopf's private
    # ``registry._spawning._handlers`` (1.37+) — a kopf upgrade can rename or
    # move that internal without crashing, and the failure mode is silently
    # unwrapped handlers (D05 enforcement quietly disabled). The
    # ``tests/test_singleton_registry_coverage.py`` CI gate fails loudly if
    # the internals change shape, but we still require a deliberate bump here.
    "kopf>=1.37,<1.45",
    # Upper bound guards against silent API drift on RBAC-sensitive calls
    # (issue #292): ``list_namespaced_custom_object`` (singleton.py),
    # ``patch_namespaced_custom_object_status`` (status_store.py),
    # ``patch_namespaced_deployment`` (worker_recycler.py,
    # web_background_monitor.py), and ``list_namespaced_pod`` /
    # ``delete_namespaced_pod`` (analysis_sla.py) all broker RBAC actions
    # through the kubernetes client — a major-version bump could silently
    # remove or weaken the impersonation / SSRF guard rails without
    # crashing. Require a deliberate bump, mirroring the kopf gate above.
    "kubernetes>=29.3.0,<37",
    "redis>=5.0", # read-only queue-fabric client (#12)
    "requests>=2.32.0",
    "prometheus-client>=0.20.0", # Phase 4: /metrics endpoint
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Minimum keeps local rule sets aligned with CI (see #68): CI installs
    # latest ruff (0.16.3 at time of writing) and activated rules the old
    # local floor (0.5.0 / actual 0.14.5) missed — TRY004 (#59) and RUF059
    # (#64) each cost a CI fix-up cycle. CI pins the same floor in
    # .github/workflows/ci.yml.
    "ruff>=0.16",
    "responses>=0.25.0", # mock OpenStudio REST API in tests
    "fakeredis>=2.23", # mock Redis for the read-only client tests (#12)
    "hypothesis>=6", # property-based tests for the D12 timestamp boundary (#246)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openstudio_operator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Issue #507 — E402 (module-level import not at top of file) is enforced on
# top of ruff's default rule set (E4/E7/E9 + F): mid-file imports had crept
# in via later refactors (#165, #395, #495, #505) and the default set is
# blind to them. Deliberate cycle-breaking deferrals live inside functions
# (function-scope imports are invisible to E402); a genuine module-level
# deferral would carry a targeted ``# noqa: E402`` with the cycle rationale.
[tool.ruff.lint]
extend-select = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Issue #257 — print the slowest 10 tests in CI (any >1 s is visible by
# default; the floor of 1.0 s suppresses the noise from sub-second tests
# that dominate the count) so a regression that pushes one test over the
# budget surfaces in PR feedback. The hard ceiling (slowest 10 total
# >30 s) is enforced by a `pytest_terminal_summary` hook in
# `tests/conftest.py` — the addopts just make the slow tests visible.
addopts = "-q --durations=10 --durations-min=1.0"
